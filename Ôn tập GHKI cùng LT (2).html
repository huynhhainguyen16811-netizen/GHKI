“người nhân lên gấp bội sức mạnh của con người”?", "type": "mc", "opts": ["Giêm Oát.", "Giêm Ha-gri-vơ.", "Ác-crai-tơ.", "Ét-mơn Các-rai."], "ans": null}, {"topic": "BÀI 6: CÁC CUỘC CÁCH MẠNG CÔNG NGHIỆP THỜI KÌ CẬN ĐẠI", "num": 14, "q": "Những thành tựu cơ bản của cuộc cách mạng công nghiệp lần thứ nhất là?", "type": "mc", "opts": ["máy kéo sợi, máy dệt, máy hơi nước, đầu máy xe lửa.", "máy kéo sợi, máy dệt, máy hơi nước, máy bay.", "máy kéo sợi, máy dệt, ô tô, máy hơi nước.", "máy dệt, máy hơi nước, tàu thuỷ, điện thoại."], "ans": null}, {"topic": "BÀI 6: CÁC CUỘC CÁCH MẠNG CÔNG NGHIỆP THỜI KÌ CẬN ĐẠI", "num": 15, "q": "Giêm Oát là người đã phát minh ra:", "type": "mc", "opts": ["con thon bay.", "máy dệt.", "máy hơi nước.", "đầu máy xe lửa."], "ans": null}, {"topic": "BÀI 6: CÁC CUỘC CÁCH MẠNG CÔNG NGHIỆP THỜI KÌ CẬN ĐẠI", "num": 16, "q": "Những thành tựu cơ bản của cuộc Cách mạng công nghiệp lần thứ hai là gì?", "type": "mc", "opts": ["Máy hơi nước, điện thoại, điện, ô tô.", "Điện thoại, điện, ô tô, máy bay.", "Ô tô, máy bay, máy tính, internet.", "Điện thoại, điện, ô tô, tàu hoả."], "ans": null}, {"topic": "BÀI 2: TRI THỨC LỊCH SỬ VÀ CUỘC SỐNG", "num": 1, "q": "Đọc đoạn tư liệu sau đây: “Vì sao mà làm quốc sử? Vì sử chủ yếu là để ghi chép sự việc. Có chính trị của một đời tất phải có sử một đời. Mà ngòi bút chép sử giữ nghị luận rất nghiêm, ca ngợi đời thịnh trị thì sáng tỏ ngang với mặt trời, mặt trăng, lên án kẻ loạn tặc thì gay gắt như sương thu lạnh buốt, người thiện biết có thể bắt chước, người ác biết có thể tự răn, quan hệ đến việc chính trị không phải là không nhiều. Cho nên làm sử là cốt để cho được như thế”. (Bài Tựa sách Đại Việt sử ký bản tục biên, Phạm Công Trứ)", "type": "tf", "items": [{"t": "Bài tựa sách của Phạm Công Trứ tóm tắt lại nội dung một tác phẩm văn học.", "a": null}, {"t": "Phạm Công Trứ khẳng định việc viết quốc sử chỉ nhằm giáo dục và nêu gương.", "a": null}, {"t": "Đoạn trích cung cấp tri thức về chức năng và nhiệm vụ của Sử học.", "a": null}, {"t": "Đoạn trích phản ánh các nội dung khác nhau của khái niệm lịch sử.", "a": null}]}, {"topic": "BÀI 2: TRI THỨC LỊCH SỬ VÀ CUỘC SỐNG", "num": 2, "q": "Đọc đoạn tư liệu sau đây: “Sự kiện lịch sử chỉ được ghi lại, dưới dạng này hay dạng khác, trong các tư liệu lịch sử. Do đó, nhà sử học muốn lí giải đúng sự thật khách quan và tìm ra được câu trả lời đúng cho câu hỏi đặt ra, không có cách nào khác là phải dựa trên cơ sở các nguồn sử liệu. Một vấn đề lịch sử nào đó được tồn tại thực sự hay không, hoàn toàn phụ thuộc vào một điều kiện không thể thiếu được là có tư liệu lịch sử của vấn đề ấy hay không. Nếu không có tư liệu thì vấn đề ấy không thể đặt ra một cách thực sự, tức là đặt ra để có thể giải quyết được”. (Phan Ngọc Liên, Phương pháp luận sử học, NXB Đại học Sư phạm, Hà Nội, 2011, tr. 201)", "type": "tf", "items": [{"t": "Tư liệu lịch sử là hiện thực lịch sử được phản ánh lại qua các dạng thức khác nhau.", "a": null}, {"t": "Nếu không có nguồn sử liệu thì không thể đảm bảo tính khách quan khi nghiên cứu lịch sử.", "a": null}, {"t": "Hiện tại và tương lai là bằng chứng cụ thể để chứng minh một hiện thực lịch sử đã diễn ra.", "a": null}, {"t": "Tất cả các loại hình sử liệu chữ viết luôn có độ chính xác cao khi phản ánh hiện thực lịch sử.", "a": null}]}, {"topic": "BÀI 2: TRI THỨC LỊCH SỬ VÀ CUỘC SỐNG", "num": 3, "q": "Đọc hai đoạn tư liệu sau đây: Tư liệu 1: “Sử để ghi việc, mà việc hay hoặc dở đều dùng làm gương răn cho đời sau” (Ngô Sĩ Liên và các sử thần nhà Lê, Đại Việt sử kí toàn thư, tập I, NXB Khoa học xã hội, Hà Nội, 1998, tr.101) Tư liệu 2: “Dân ta phải biết sử ta Cho tường gốc tích nước nhà Việt Nam” (Hồ Chí Minh, Lịch sử nước ta, 1942)", "type": "tf", "items": [{"t": "Đoạn tư liệu 1 vừa phản ánh chức năng khoa học, vừa phản ánh chức năng xã hội của Sử học.", "a": null}, {"t": "“…việc hay hoặc dở đều dùng làm gương răn cho đời sau” phản ánh nhiệm vụ cung cấp tri thức khoa học của Sử học.", "a": null}, {"t": "Ở đoạn tư liệu 2, Hồ Chí Minh khuyến khích nhân dân ta nên tìm hiểu, nghiên cứu về lịch sử nước nhà.", "a": null}, {"t": "Ý nghĩa sâu xa của cả hai đoạn tư liệu là đều nhấn mạnh tầm quan trọng của tri thức lịch sử đối với một quốc gia, dân tộc.", "a": null}]}, {"topic": "BÀI 3: VAI TRÒ CỦA SỬ HỌC", "num": 1, "q": "Đọc đoạn tư liệu sau đây: Dân ca quan họ là loại hình văn hóa dân gian được hình thành từ lâu đời. Từ 49 làng Quan họ cổ, đến nay đã có 369 làng Quan họ thực hành, 381 câu lạc bộ Dân ca Quan họ với trên 10 000 người ở các độ tuổi tham gia (trong đó có hơn 600 người có khả năng truyền dạy cho lớp trẻ). Dân ca Quan họ là biểu tượng văn hóa trong quá trình hội nhập văn hóa quốc tế, đã lan ra khắp vùng Kinh Bắc và nhiều địa phương trên cả nước, phát triển mạnh trong cộng đồng kiều bào ở Đức, Pháp, Séc, Nga,… Dân ca Quan họ đã được UNESCO ghi danh là Di sản Văn hóa phi vật thể đại diện của nhân loại (2009). Sử học đã góp phần quan trọng vào bảo tồn và phát huy giá trị của Dân ca quan họ.", "type": "tf", "items": [{"t": "Dân ca quan họ là một loại hình di sản văn hóa phi vật thể của Việt Nam đã được UNESCO ghi danh.", "a": null}, {"t": "Giá trị của dân ca Quan họ đã được xác định đúng và được phát huy nhờ những nghiên cứu của Sử học.", "a": null}, {"t": "Việc phát triển các làng quan họ, các câu lạc bộ Dân ca Quan họ là một thành công của công tác bảo tồn và phát huy giá trị di sản.", "a": null}, {"t": "Việc quảng bá hình ảnh, giá trị của Dân ca Quan họ trong cả nước và ra nước ngoài là nhiệm vụ duy nhất của những nhà nghiên cứu Sử học.", "a": null}]}, {"topic": "BÀI 3: VAI TRÒ CỦA SỬ HỌC", "num": 2, "q": "Đọc đoạn tư liệu sau đây: Việt Nam được bầu chọn là “Điểm đến hàng đầu châu Á về di sản, ẩm thực và văn hóa” (2020) và “Điểm đến du lịch bền vững hàng đầu châu Á” (2021) là nhờ có hệ thống di tích lịch sử - văn hóa, di sản văn hóa và di sản thiên nhiên đa dạng phân bố trên khắp cả nước, như Phố cổ (Hà Nội), Cố đô Hoa Lư (Ninh Bình), Cố đô Huế (Thừa Thiên Huế), Phố cổ Hội An (Quảng Nam), Vịnh Hạ Long (Quảng Ninh),… Điểm chung của các địa danh này chính là sức hấp dẫn của các yếu tố về lịch sử, văn hóa, cảnh quan. Đây cũng là những nơi còn lưu giữ được dấu ấn lịch sử, văn hóa truyền thống một cách có hệ thống, được chính phủ và chính quyền địa phương quan tâm kết hợp bảo tồn và khai thác khoa học.", "type": "tf", "items": [{"t": "Đoạn tư liệu cung cấp thông tin về vai trò của Sử học đối với công tác bảo tồn và phát huy giá trị của di sản văn hóa.", "a": null}, {"t": "Các di tích lịch sử - văn hóa là một trong những nguồn tài nguyên du lịch quý giá giúp Việt Nam được bình chọn là “Điểm đến hàng đầu châu Á về di sản, ẩm thực và văn hóa” năm 2020.", "a": null}, {"t": "Phố cổ (Hà Nội), Cố đô Hoa Lư (Ninh Bình), Phố cổ Hội An (Quảng Nam), Vịnh Hạ Long (Quảng Ninh) đều là các di tích lịch sử - văn hóa có sức hấp dẫn của nước ta.", "a": null}, {"t": "Các di sản văn hóa, di sản thiên nhiên của nước ta được chính phủ và chính quyền địa phương quan tâm kết hợp bảo tồn và khai thác khoa học thông qua các hoạt động quảng bá và du lịch.", "a": null}]}, {"topic": "BÀI 3: VAI TRÒ CỦA SỬ HỌC", "num": 3, "q": "Đọc đoạn tư liệu sau đây: Cho thông tin, tư liệu sau đây: “Theo các nguồn sử liệu, tín ngưỡng thờ cúng Hùng Vương đã phát triển mạnh mẽ từ rất lâu, trước khi chính thức được vinh danh vào thời Hậu Lê (1428-1789). Cho đến nay, Đảng và Nhà nước rất quan tâm tới việc thờ cúng các Vua Hùng, cấp kinh phí để tôn tạo không gian thờ cúng, đưa truyền thuyết Hùng Vương vào chương trình giảng dạy để giáo dục thế hệ trẻ, cho phép nhân dân cả nước nghỉ lễ ngày Giỗ Tổ để tham gia các hoạt động tế lễ, hướng về cội nguồn dân tộc. Năm 2023 đánh dấu 11 năm Tín ngưỡng thờ cúng Hùng Vương ở Phú Thọ được UNESCO ghi danh là Di sản Văn hoá phi vật thể của nhân loại, mà Đền Hùng là trung tâm thực hành tín ngưỡng thờ cúng Hùng Vương của dân tộc Việt Nam”. (Nguyễn Thị Phương Dung, Phan Thanh An, “Vai trò di sản Đền Hùng đối với phát triển du lịch văn hoá”, Tạp chí Văn học nghệ thuật, số 533, tháng 5-2023)", "type": "tf", "items": [{"t": "Đoạn tư liệu cung cấp tri thức lịch sử về Tín ngưỡng thờ cúng An Dương Vương ở Phú Thọ.", "a": null}, {"t": "Năm 2023, UNESCO chính thức ghi danh Tín ngưỡng thờ cúng Hùng Vương là Di sản Văn hoá phi vật thể của nhân loại.", "a": null}, {"t": "Bảo tồn và phát huy giá trị di sản Đền Hùng thuộc về trách nhiệm của tất cả người dân", "a": null}, {"t": "Sử học có mối quan hệ mật thiết trong công tác bảo tồn và phát huy giá trị di sản Đền Hùng.", "a": null}]}, {"topic": "BÀI 5: MỘT SỐ NỀN VĂN MINH PHƯƠNG TÂY THỜI CỔ - TRUNG ĐẠI", "num": 1, "q": "Đọc đoạn tư liệu sau đây: “Hy Lạp là quê hương của nền triết học phương Tây được hình thành nên cơ sở của nền kinh tế công thương nghiệp phát triển, xã hội chiếm nô đạt đến mức cao và trên nền tảng của những thành tựu khoa học tự nhiên, ít bị chi phối bởi tôn giáo. Ngay từ xa xưa, người Hy Lạp đã sản sinh ra những từ trưởng triết học với các hình thái, xu hướng khác nhau, phản ảnh những quan điểm của các giai cấp-với các khuynh hướng kinh tế và chính trị - khác nhau, trong xã hội chiếm nô Hy Lạp, đồng thời cũng phản ảnh cuộc xung đột gay gắt, quyết liệt giữa các giai tầng này”. (Lương Ninh (chủ biên), Lịch sử thế giới cổ đại, NXB Giáo dục, Hà Nội, 2009, tr.169)", "type": "tf", "items": [{"t": "Đoạn tư liệu trên phản ánh sự phát triển của nền triết học Hy Lạp cổ đại, chịu tác động mạnh mẽ của thần thoại và tôn giáo.", "a": null}, {"t": "Triết học Hy Lạp cổ đại chỉ phục vụ cho lợi ích của tầng lớp nô lệ và những người lao động, phản ánh khát vọng tự do và tư tưởng phản kháng đối với giai cấp chủ nô thống trị.", "a": null}, {"t": "Triết học Hy Lạp cổ đại hình thành trên cơ sở kinh tế - xã hội phát triển và đã phản ánh cuộc đấu tranh tư tưởng giữa các giai cấp trong xã hội.", "a": null}, {"t": "Triết học Hy Lạp cổ đại có vai trò quan trọng trong việc đặt nền móng cho tư duy lý tính, khoa học và nhân văn của châu Âu sau này.", "a": null}]}, {"topic": "BÀI 5: MỘT SỐ NỀN VĂN MINH PHƯƠNG TÂY THỜI CỔ - TRUNG ĐẠI", "num": 2, "q": "Đọc đoạn tư liệu sau đây: “Trên cơ sở điều kiện tự nhiên, dân cư, kinh tế, chính trị, xã hội cùng với sự kế thừa nền văn minh phương Đông cổ đại, nền văn minh Hy Lạp - La Mã đã đạt được nhiều thành tựu rực rỡ. Cư dân Hy Lạp đã sáng tạo ra hệ cái A, B, C và người La Mã đã kế thừa, phát triển thành chữ La-tinh. Đây là nền tảng cho hệ chữ viết La-tinh hiện nay. Chữ viết Hy Lạp và La Mã đơn giản, ngắn gọn, linh hoạt, mang tính khái quát hóa. Văn học Hy Lạp cổ đại phong phú, nhiều thể loại (sử thi, kịch, thần thoại,...) và đạt nhiều thành tựu lớn. Trong đó, nổi bật là hai bộ sử thi I-li-át và Ô-đi-xê của Hô-me, kịch Ơ-đip làm vua của Xô-phốc-lơ.”", "type": "tf", "items": [{"t": "Tư liệu đề cập đến những thành tựu của nền văn minh Hy Lạp - La Mã thời cổ đại.", "a": null}, {"t": "Văn minh Hy Lạp ra đời cùng thời và kế thừa thành tựu của văn minh phương Đông. c. Chữ viết là thành tựu của văn minh Hy Lạp và có ảnh hưởng đến phần lớn thế giới.", "a": null}, {"t": "Hy Lạp - La Mã là trung tâm văn minh cổ đại đã sáng tạo ra các bộ sử thi lớn nhất.", "a": null}]}, {"topic": "BÀI 5: MỘT SỐ NỀN VĂN MINH PHƯƠNG TÂY THỜI CỔ - TRUNG ĐẠI", "num": 3, "q": "Đọc đoạn tư liệu sau đây: “Đánh giá về phong trào Văn hóa Phục hưng, Ăng-ghen viết: “Đó là một cuộc cách mạng tiến bộ, vĩ đại nhất mà loài người chưa từng thấy, một thời đại cần đến những con người khổng lồ và đã sinh ra những con người khổng lồ, khổng lồ về tư tưởng, về nhiệt tình và về tính cách, khổng lồ về tài năng mọi mặt và sự hiểu biết sâu rộng của họ.” (Lương Ninh, Lịch sử văn hóa thế giới cổ trung đại)”", "type": "tf", "items": [{"t": "Tây Âu thời kì Phục hưng là thời kì phục hồi toàn bộ giá trị văn hóa Hy Lạp - La Mã cổ đại.", "a": null}, {"t": "Phong trào Văn hóa Phục hưng diễn ra đã trực tiếp xóa bỏ chế độ phong kiến ở châu Âu.", "a": null}, {"t": "“Những người khổng lồ” là cụm từ để chỉ những người có tư tưởng tiến bộ và tài năng trên nhiều lĩnh vực trong thời kì Văn hóa Phục hưng.", "a": null}, {"t": "Phong trào Văn hóa Phục hưng được xem như một cuộc cách mạng tiến bộ vĩ đại của loài người trong lịch sử.", "a": null}]}, {"topic": "BÀI 6: CÁC CUỘC CÁCH MẠNG CÔNG NGHIỆP THỜI KÌ CẬN ĐẠI", "num": 1, "q": "Đọc đoạn tư liệu sau đây: “Từ thập niên 1780 trở đi, động cơ hơi nước đã được sử dụng ở các nhà máy. Những xưởng nấu sắt sử dụng máy hơi nước để chạy máy bơm hơi, giúp cho các lò cao có đầy đủ sức gió; các mỏ than đá dùng máy hơi nước để chạy máy bơm hút nước từ các hầm lò lên, ngành dệt dùng máy hơi nước để tạo ra động lực chuyển các công cụ. Năm 1785, người ta đã biết dùng máy hơi nước trong các xưởng dệt len nỉ. Năm 1789, người ta dùng máy hơi nước trong xưởng dệt vải. Chúng đã đạt được công suất từ 6 đến 20 mã lực, lớn hơn bất kì cối xay gió hay những guồng nước lớn nhất, đáng tin cậy hơn và được lắp đặt ở bất kì đâu. Đến năm 1800, toàn nước Anh đã có 321 cỗ máy hơi nước, với tổng công suất 5210 mã lực. Đến năm 1825 tăng lên 15000 cỗ máy hơi nước với tổng công suất 375000 mã lực.” (Lưu Tộ Xương, Quang Nhân Hồng, Hàn Thừa Văn, Lịch sử thế giới cận đại (1640 - 1900), NXB Thành phố Hồ Chí Minh, TP. Hồ Chí Minh, 2002, tr.108)", "type": "tf", "items": [{"t": "Đoạn tư liệu trên đề cập đến động cơ hơi nước - một trong những phát minh tiêu biểu của cách mạng công nghiệp lần hai.", "a": null}, {"t": "Việc động cơ hơi nước thay thế sức nước và sức gió đã cho phép các nhà máy được xây dựng ở bất kì đâu, thoát khỏi sự phụ thuộc vào các nguồn năng lượng tự nhiên theo địa lí.", "a": null}, {"t": "Việc sử dụng động cơ hơi nước làm tăng đáng kể sản lượng sản xuất, thúc đẩy sự phát triển của xã hội công nghiệp, đồng thời gây ra nhu cầu cao về nguyên liệu, buộc các nước tư bản phải tăng cường xâm chiếm thuộc địa.", "a": null}, {"t": "Đến năm 1825, toàn nước Anh có 15.000 cỗ máy hơi nước, chứng tỏ động cơ hơi nước chỉ được ứng dụng ở các công xưởng thủ công nghiệp lớn để tăng hiệu suất lao động.", "a": null}]}, {"topic": "BÀI 6: CÁC CUỘC CÁCH MẠNG CÔNG NGHIỆP THỜI KÌ CẬN ĐẠI", "num": 2, "q": "Đọc đoạn tư liệu sau đây: Làn sóng công nghiệp hóa, mức tăng dân số cao, quá trình đô thị hóa tăng tốc đã làm thay đổi hoàn toàn bộ mặt các nước tư bản phương Tây những năm đầu thế kỉ XX. Lần đầu tiên trong lịch sử nhân loại, khoảng gần 50% dân số các nước phương Tây sống trong các đô thị. Những tòa nhà chọc trời bắt đầu được xây dựng như một biểu trưng cho sự phồn vinh của nền kinh tế tư bản chủ nghĩa, mà Mĩ là nước đi đầu. Năm 1885, tòa nhà 10 tầng đầu tiên được xây dựng ở Chicagô, sau đó là tòa nhà cao 57 tầng được khánh thành ở New York năm 1913. Xã hội công nghiệp dần dần hình thành trong lòng các nước tư bản phương Tây giàu có và thật sự khẳng định ưu thế, sức mạnh của nó đối với phần còn lại của thế giới. (Trần Thị Vinh, Chủ nghĩa tư bản lịch sử thăng trầm 120 năm (1900 – 2020), NXB Chính trị quốc gia sự thật, Hà Nội, 2021, tr. 81)", "type": "tf", "items": [{"t": "Đoạn tư liệu phản ánh tác động của cuộc cách mạng công nghiệp cuối thế kỉ XIX đầu thế kỉ XX về mặt xã hội.", "a": null}, {"t": "Sự phát triển nhanh chóng của nền sản xuất vật chất cuối thế kỉ XIX đầu thế kỉ XX đã kéo theo những biến đổi quan trọng trong cơ cấu dân cư các nước tư bản chủ nghĩa.", "a": null}, {"t": "Đầu thế kỉ XX, do sự suy giảm của nông nghiệp và sự phát triển của công nghiệp, dân số sống trong các đô thị ở phương Tây đã chiếm một nửa tổng dân số đất nước.", "a": null}, {"t": "Sự xuất hiện của các trung tâm kinh tế như Chicagô, New York là hệ quả tất yếu của quá trình công nghiệp hóa, đô thị hóa ở các nước phương Tây cuối thế kỉ XIX đầu thế kỉ XX.", "a": null}]}, {"topic": "BÀI 6: CÁC CUỘC CÁCH MẠNG CÔNG NGHIỆP THỜI KÌ CẬN ĐẠI", "num": 3, "q": "Đọc đoạn tư liệu sau đây: “Các nghiên cứu về điện có từ thời cổ đại, tuy nhiên động cơ điện đầu tiên được phát minh bởi Mai – cơn Pha – ra – đây (1821). Năm 1879, Ê – đi – xơn đã hoàn thiện phát minh ra bóng đèn sợi đốt trong và cùng với Giô – dép Goan thương mại hóa đèn điện giúp thắp sáng các nhà ở, thành phố, nhà xưởng. Ni – cô – lai Tét – la đã thúc đẩy sự phát triển của mạng lưới điện xoay chiều được dùng phổ biến ngày nay. (Sách giáo khoa Lịch sử 10, bộ kết nối tri thức với cuộc sống, tr.41)", "type": "tf", "items": [{"t": "Những nghiên cứu khoa học về điện đã có từ thời cổ đại, nhưng phải đến thế kỉ XIX, con người mới tạo ra được những phát minh kĩ thuật về điện đầu tiên.", "a": null}, {"t": "Động cơ điện và các thiết bị điện là những phát minh tiêu biểu của cuộc cách mạng công nghiệp lần thứ nhất.", "a": null}, {"t": "Các phát minh của Mai – cơn Pha – ra – đây, Ê – đi – xơn, Ni – cô – lai Tét – la đã thúc đẩy việc ứng dụng nguồn năng lượng điện vào sản xuất và đời sống.", "a": null}, {"t": "Sau khi được Ê – đi – xơn phát minh vào cuối thế kỉ XIX, bóng đèn điện đã được sản xuất hàng loạt và ứng dụng rộng rãi trong thực tế cuộc sống.", "a": null}]}, {"topic": "BÀI 3: VAI TRÒ CỦA SỬ HỌC", "num": 1, "q": "Địa phương (tỉnh hoặc thành phố) nơi em đang sinh sống và học tập có di sản văn hoá, di sản thiên nhiên nào? Em hãy đề xuất một số biện pháp để bảo tồn, phát huy tốt hơn giá trị của các di sản đó.", "type": "es", "guide": []}, {"topic": "BÀI 3: VAI TRÒ CỦA SỬ HỌC", "num": 2, "q": "Theo em, chính quyền địa phương cần thực hiện những biện pháp nào để bảo tồn và phát huy giá trị của các di sản văn hóa tại địa phương?", "type": "es", "guide": []}, {"topic": "BÀI 4: KHÁI NIỆM VĂN MINH. MỘT SỐ NỀN VĂN MINH PHƯƠNG ĐÔNG THỜI CỔ - TRUNG ĐẠI", "num": 1, "q": "Em hãy giải thích những đóng góp của chữ viết và văn học Trung Hoa thời cổ – trung đại đối với sự phát triển văn hóa.", "type": "es", "guide": ["* Gợi ý:", "Về chữ viết: chữ Hán là phương tiện quan trọng để lưu giữ, truyền bá tri thức, tư tưởng, lịch sử, luật pháp và văn hóa; tạo nền tảng cho sự phát triển của Trung Hoa.", "Về văn học: Nhiều thể loại phong phú như thơ ca và tiểu thuyết chương hồi làm phong phú kho tàng văn hóa nhân loại."]}, {"topic": "BÀI 4: KHÁI NIỆM VĂN MINH. MỘT SỐ NỀN VĂN MINH PHƯƠNG ĐÔNG THỜI CỔ - TRUNG ĐẠI", "num": 2, "q": "Những thành tựu chữ viết và văn học Trung Hoa thời cổ – trung đại này có ảnh hưởng gì đối với Việt Nam.", "type": "es", "guide": ["* Gợi ý:", "Ảnh hưởng của chữ viết: Trên cơ sở tiếp thu chữ Hán, ông cha ta đã sáng tạo ra chữ Nôm để ghi tiếng nói dân tộc, thể hiện tinh thần tự chủ, tự cường văn hóa.", "Ảnh hưởng của văn học: Góp phần bồi dưỡng tâm hồn, đạo đức và làm phong phú thêm nền văn học truyền thống của dân tộc ta."]}, {"topic": "BÀI 4: KHÁI NIỆM VĂN MINH. MỘT SỐ NỀN VĂN MINH PHƯƠNG ĐÔNG THỜI CỔ - TRUNG ĐẠI", "num": 3, "q": "Em hãy giải thích giá trị, ý nghĩa của những thành tựu tiêu biểu về tôn giáo và kiến trúc của nền văn minh Ấn Độ thời cổ – trung đại.", "type": "es", "guide": ["* Gợi ý:", "Phật giáo và Hin-đu giáo là hai tôn giáo góp phần làm phong phú đời sống tinh thần, tín ngưỡng của người dân và có ảnh hưởng đến văn hóa nhiều nước.", "Các công trình chùa, tháp và đền thờ thể hiện trình độ nghệ thuật, kỹ thuật xây dựng và sự phát triển của văn minh Ấn Độ."]}, {"topic": "BÀI 4: KHÁI NIỆM VĂN MINH. MỘT SỐ NỀN VĂN MINH PHƯƠNG ĐÔNG THỜI CỔ - TRUNG ĐẠI", "num": 4, "q": "Những thành tựu tiêu biểu về tôn giáo và kiến trúc của nền văn minh Ấn Độ thời cổ – trung đại có ảnh hưởng gì đối với nền văn hóa Việt Nam.", "type": "es", "guide": ["* Gợi ý:", "Đối với Việt Nam, Phật giáo có ảnh hưởng đến đời sống văn hóa Việt Nam.", "Nghệ thuật kiến trúc và điêu khắc Chăm, tiêu biểu là thánh địa Mỹ Sơn, cũng mang dấu ấn của văn minh Ấn Độ."]}, {"topic": "BÀI 4: KHÁI NIỆM VĂN MINH. MỘT SỐ NỀN VĂN MINH PHƯƠNG ĐÔNG THỜI CỔ - TRUNG ĐẠI", "num": 5, "q": "Phân tích mối quan hệ giữa điều kiện tự nhiên và sự ra đời của các nhà nước cổ đại phương Đông.", "type": "es", "guide": ["Các nhà nước đều ra đời trên lưu vực các con sông lớn (sông Nin, sông Ấn, sông Hằng, Hoàng Hà...) nơi có đất phù sa màu mỡ và nguồn nước dồi dào.", "Điều kiện tự nhiên thuận lợi giúp kinh tế nông nghiệp trồng lúa nước phát triển sớm, tạo ra của cải dư thừa, dẫn đến xã hội phân hóa giàu nghèo và xuất hiện giai cấp.", "Thiên tai lũ lụt buộc các bộ lạc phải liên kết lại với nhau để đắp đê, làm thủy lợi. Công việc này đòi hỏi phải có một tổ chức chỉ huy, quản lý tập trung và thống nhất.", "Bộ máy chỉ huy trị thủy dần chuyển hóa thành bộ máy cai trị, dẫn đến sự ra đời sớm của các nhà nước cổ đại theo thể chế quân chủ chuyên chế (vua nắm quyền lực tuyệt đối)."]}, {"topic": "BÀI 4: KHÁI NIỆM VĂN MINH. MỘT SỐ NỀN VĂN MINH PHƯƠNG ĐÔNG THỜI CỔ - TRUNG ĐẠI", "num": 6, "q": "\"Tứ đại phát minh\" của văn minh Trung Hoa co ý nghĩa của đối với lịch sử nhân loại?", "type": "es", "guide": ["* “Tứ đại phát minh” của văn minh Trung Hoa gồm giấy, kỹ thuật in, thuốc súng và la bàn. Những phát minh này có ý nghĩa to lớn đối với lịch sử nhân loại:", "Giúp lưu trữ thông tin dễ dàng, gọn nhẹ, thay đổi phương thức truyền bá tri thức, góp phần thúc đẩy sự phát triển của văn hóa, giáo dục và khoa học.", "Thay đổi cách thức chiến tranh (ra đời vũ khí nóng) và làm suy yếu chế độ phong kiến châu Âu.", "Hỗ trợ định hướng trên biển, mở đường cho các cuộc đại phát kiến địa lý tìm ra vùng đất mới, , thúc đẩy giao thương và giao lưu giữa các quốc gia, dân tộc.", "=> Góp phần thúc đẩy tiến trình phát triển của văn minh nhân loại, tạo tiền đề cho nhiều biến đổi quan trọng trong lịch sử thế giới."]}], "van": [{"num": 1, "title": "A-NHI – THẦN LỬA", "passage": ["(Thần thoại Ấn Độ)", "A-nhi là một trong những vị thần lớn nhất và lâu đời nhất của Ấn Độ. Thần rất cao lớn, da thịt đỏ au, có bảy cánh tay màu sắc như cầu vồng, lưỡi dài và lanh lẹ lạ thường.", "Chính thần đã tung lên trời quả cầu lửa sưởi ấm chúng ta, nung chín trái cây, lúa, đỗ, ngày ngày soi sáng cho chúng ta làm ăn. Chính thần thắp các vì sao lên, nếu không đêm tối sẽ sâu thăm thẳm và rùng rợn biết bao. Thần có phép phân thân nên thần ở khắp mọi nhà, vào bếp nấu thức ăn, đốt đèn rọi trang sách. Không có thần ở trong nhà, con người sẽ đói, rét, sợ sệt, sống không khác gì loài cầm thú.", "Thần có tính nóng vội, lại phải ở khắp nơi, không coi xuể công việc, nên đôi lúc vô tình gây thiệt hại cho sinh linh và hoa cỏ.", "Một hôm A-nhi giúp người đốt cỏ dại ở ven rừng. Mải lo đi giúp nơi khác nữa, thần không về dập lửa kịp thời, nên lửa cháy vào khu rừng, lan rộng ra nhanh chóng, trong rừng có năm mẹ con con chim Đầu Rìu. Chim mẹ kêu than: con mình chưa biết bay, phen này mẹ con chắc bị thiêu sống.", "Bỗng chim nghĩ được một kế cứu con:", "- Các con ơi, đằng kia có cái hang chuột. Các con hãy vào đấy, mẹ sẽ khoả cát lên lấp tạm, khi lửa tắt mẹ sẽ đến đón các con.", "- Nhưng mẹ ơi – một con chim thưa – con chuột to lắm, nó sẽ ăn thịt chúng con mất.", "- Không đâu, bé yêu ạ. Con chuột ở cái hang này đã bị diều hâu bắt rồi, chính mắt mẹ trông thấy.", "- Còn có những con chuột khác, mẹ ạ - một con chim nữa nói – Bị chuột ăn thì đau đớn và nhục nhã quá, mẹ ơi, thà chết thiêu còn hơn.", "- Bị thiêu nóng lắm, các con ạ. Chỉ còn một cách là mẹ xoè hai cánh ra ấp các con dưới bụng, che lửa cho các con. Mẹ sẽ chết cháy còn các con may chăng sống sót.", "- Không, không mẹ ơi! Không đời nào! – Bốn chú chim con đồng thanh kêu lên. Rồi chú khôn nhất nói: “Nếu mẹ chết thì chúng con cũng sẽ chết đói, chết khát thôi. Và họ Đầu Rìu nhà ta sẽ tuyệt giống, tuyệt nòi. Mẹ còn trẻ lắm. Thoát nạn này, mẹ sinh một lũ em. Mẹ hãy bay đi, bay nhanh đi, lửa đến rồi. Chúng con van mẹ”", "- Mẹ trốn một mình sao đành chứ?", "- Trốn đi, trốn đi mẹ ơi! – Bốn chú chim con lại đồng thanh kêu lớn– Bay nhanh đi, nếu không chúng con đâm đầu vào lửa cho mà xem.", "Mấy con chim con vỗ lạch bạch những đôi cánh chưa có lông rắp xông và lửa. Chim mẹ hoảng quá, đành phải bay đi.", "Bấy giờ bốn anh em chụm đầu vào nhau thử kêu cầu thần Lửa.", "- Thần A-nhi quảng đại ôi! Chúng con hiện nay mất mẹ, lát nữa sẽ mất xác?Rồi mẹ chúng con sẽ vì xót xa mà chết héo chết khô. Chỉ có ngài là cứu được chúng con hỡi thần A-nhi nhân hậu.", "Bỗng có tiếng vang vọng từ xa:", "- Các con đừng lo sợ. Tai hoạ sắp qua rồi. Và mẹ các con sẽ về với các con.", "Đó là tiếng của Thần Lửa. Thần đã trở về và kịp nghe tiếng kêu cầu thảm thiết của mấy chú chim con. Thần dập tắt ngay ngọn lửa hung dữ, liền đó chim đầu rìu mẹ cũng quay về.", "Cảm tạ thần A-nhi nhân hậu, năm mẹ con nhuộm đỏ chùm lông mũ của mình, ngụ ý thờ Thần Lửa trên đầu.", "(Huỳnh Lý thuật – Sách giáo khoa Văn lớp 6, NXB Giáo dục, 1989, tr.35-36)"], "qs": ["Câu 1. (0,5 điểm) Xác định nhân vật chính và nêu một đặc điểm ngoại hình của nhân vật ấy.", "Câu 2. (0,5 điểm) Theo văn bản, vì sao thần A-nhi đôi lúc vô tình gây thiệt hại cho sinh linh và hoa cỏ?", "Câu 3. (1,0 điểm) Câu chuyện về mẹ con nhà chim Đầu Rìu làm nổi bật phẩm chất gì ở thần Lửa?", "Câu 4. (1,0 điểm) “Thần có tính nóng vội, lại phải ở khắp nơi, không coi xuể công việc, nên đôi lúc vô tình gây thiệt hại cho sinh linh và hoa cỏ”. Chi tiết trên cho thấy người Ấn Độ cổ đại có quan niệm như thế nào về các vị thần?", "Câu 5. (1,0 điểm) Từ câu chuyện của mẹ con chim Đầu Rìu, anh/chị rút ra bài học gì có ý nghĩa nhất đối với bản thân? Lí giải ngắn gọn."], "write": ["Viết bài văn nghị luận phân tích, đánh giá chủ đề và những nét đặc sắc về hình thức nghệ thuật của tác phẩm thần thoại A-nhi – Thần Lửa."]}, {"num": 2, "title": "NỮ OA TẠO RA LOÀI NGƯỜI", "passage": ["Khi ấy, trời đất mới sinh, đã có cây cỏ, muôn thú mà chưa có loài người. Thế giới giống như một bức tranh buồn tẻ. Đi giữa thế giới hoang sơ, buồn tẻ ấy là vị đại thiên thần, chính là Nữ Oa. Lúc ấy, bà cảm thấy buồn chán, cô độc bèn nghĩ rằng cần phải tạo ra một cái gì đó cho thế giới này thêm vui tươi, giàu sức sống. Bà nghĩ ngợi hồi lâu, rồi đến bên đầm nước, lấy bùn đất màu vàng bên bờ đầm, trộn nhuyễn với nước, mô phỏng theo hình dáng của mình in bóng trên mặt nước mà nặn thành đồ vật xinh xắn, đáng yêu.", "Lạ thay, vừa đặt xuống mặt đất, đồ vật xinh xắn ấy bỗng dưng có sức sống, cất tiếng nói trong trẻo, nhảy múa, vui đùa. Đồ vật xinh xắn ấy gọi là “Người”. “Người” được bàn tay nữ thần tạo ra, không giống các loài muông thú bởi được mô phỏng từ hình dáng của vị nữ thần. Nữ Oa vô cùng thích thú, hài lòng về sản phẩm do mình vừa tạo ra, bèn tiếp tục dùng đất bùn màu vàng hòa nhuyễn với nước nhào nặn ra rất nhiều người, trai có, gái có. Nhìn những con người vui đùa, cười nói xung quanh mình, Nữ Oa cảm thấy vui vẻ hẳn lên, không còn cô độc, buồn bã nữa.", "Nhưng mặt đất hoang sơ vô cùng rộng lớn, bà làm việc không ngừng nghỉ trong một thời gian rất lâu mà mặt đất vẫn trống trải. Bà cứ miệt mài làm việc, làm tới lúc mỏi mệt lắm rồi mà mặt đất vẫn trống trải quá. Bà bèn nghĩ ra một cách, lấy một sợi dây, nhúng vào trong nước bùn, vung lên khắp phía. Người thì bảo bà dùng một sợi dây thừng, nhưng hồi đó làm gì có dây thừng, có lẽ bà đã dùng một sợi dây lấy từ một loài cây dây leo. Khi bà vung sợi dây dính đầy thứ bùn từ đất vàng đó lên, các giọt bùn đất màu vàng bắn đi khắp nơi, rơi xuống đất liền biến thành người, cười nói, chạy nhảy. Thế là mặt đất trở nên đông đúc bao nhiêu là người.", "(Trích “Nữ Oa” (Thần thoại Trung Quốc), Dương Tuấn Anh (sưu tầm, tuyển chọn) NXB Giáo dục Việt Nam, 2009)."], "qs": ["Câu 1. (0,5 điểm) Xác định nhân vật chính và không gian thần thoại trong văn bản.", "Câu 2. (0,5 điểm) Theo văn bản, Nữ Oa đã tạo ra loài người bằng cách nào?", "Câu 3. (1,0 điểm) Nhận xét đặc điểm tính cách của nhân vật chính.", "Câu 4. (1,0 điểm) Nêu ý nghĩa của hai cách Nữ Oa tạo ra loài người được kể trong văn bản, em hãy nhận xét đặc điểm trí tưởng tượng của người xưa được thể hiện trong câu chuyện.", "Câu 5. (1,0 điểm) Từ câu chuyện Nữ Oa tạo ra loài người, em hãy rút ra một bài học có ý nghĩa đối với bản thân và lí giải vì sao bài học ấy có ý nghĩa."], "write": ["Viết bài văn nghị luận phân tích, đánh giá chủ đề và những nét đặc sắc về hình thức nghệ thuật của truyện thần thoại Nữ Oa tạo ra loài người."]}, {"num": 3, "title": "NỮ THẦN A-THÊ-NA", "passage": ["Trong số các vị thần của thế giới Ô-lim-pi-a thì sự ra đời của nữ thần A-thê-na kì lạ hơn cả. Đối với các vị thần tất nhiên sự sinh ra đã khác thường rồi, nhưng A-thê-na thần kì hơn. Nàng không phải do mẹ sinh ra mà do bố sinh ra, và sinh ra ... từ đầu!", "Dớt mắc chứng đau đầu rất dữ, đau từng cơn ong ong, lục ục trong đầu. Trong một cơn đau muốn nổ tung óc, Dớt gọi thần Hê-phai-xtốt lại và ra lệnh :“Lấy búa bổ đầu ta ngay, làm ngay đi...”. Hê-phai-xtốt do dự trước cái lệnh kì quái đó, nhưng Dớt trừng mắt quát: “Bổ đi! Làm ngay đi!...” – Thế là Hê-phai-xtốt nghe lời Dớt. Chàng nâng cây búa nặng ngàn cân lên, dùng sức giáng vào đầu Dớt. Chát một cái! Hê-phai-xtốt rùng mình. Sọ của Dớt nứt toác ra, và từ kẽ nứt nhảy ra một người thiếu nữ mặc nhung y, võ phục gọn gàng, tay kiếm cung, mắt sáng long lanh, tiếng to như sấm. Vừa nhảy khỏi đầu Dớt, nàng liền hét một tiếng vang động cả trời đất như khi xung trận. Đó là A-thê- na , vị thần của trí tuệ, tri thức và chiến trận. A –thê- na đội mũ trụ đồng sáng loáng, mặc áo choàng dài, thường khi tay khoác khiên, đứng uy nghi oai phong lẫm liệt như một nam thần. Vì là nữ thần của trí tuệ, tri thức nên A-thê-na đã sáng tạo ra biết bao nhiêu điều để dạy cho người dân Hi Lạp. Nàng đã ban cho người trần thế cái cày cái bừa để họ có thể làm ruộng, trồng lúa, trồng nho. Nàng trao cho người phụ nữ cái xa quay sợi và khung cửi dệt. Nàng dạy cho họ nghề dệt khéo léo và công phu để họ có thể dệt nên tấm vải dày, mỏng tùy theo ý thích với màu sắc rực rỡ như lòng họ mong muốn. Vì thế người xưa gọi nàng là “A-thê-na Ergana” nghĩa là “thợ giỏi”. Nàng còn đặt ra các thiết chế, luật pháp cho các đô thị, để con người biết cách cai quản, điều hành cuộc sống của mình được trật tự và công bằng. Vì là nữ thần trí tuệ, tri thức nên nàng được Dớt sinh ra từ ... đầu, hay cũng vì sinh từ đầu Dớt mà nàng phải là vị nữ thần của trí tuệ, tri thức? Do đó một chức năng nữa mà A- thê – na phải đảm nhận là : đảm bảo cho khoa học và kĩ thuật ở các đô thị phát triển rực rỡ, phục vụ hữu hiệu cho con người.", "A-thê-na thường có một biệt danh quen thuộc là Palax. Người xưa giải thích, sở dĩ nàng có biệt danh này là do nàng đã đánh bại được tên khổng lồ Palax trong một trận giao tranh ác liệt. Để ghi nhớ chiến công hiển hách của mình, A-thê-na lột da địch thủ căng lên tấm khiên. [...] A-thê-na tham dự khá nhiều chuyện của thế giới thiên đình và thế giới loài người. Đối với người Hi Lạp cổ xưa, A-thê-na mang lại cho họ cuộc sống văn minh hơn. Nàng là nữ thần của tri thức. Nàng là ánh sáng của Khoa học, kĩ thuật, văn hóa, nghệ thuật soi rọi xuống cuộc sống tối tăm của con người. Nàng còn là nữ thần của chiến trận, chiến thắng. A-then một trung tâm kinh tế, chính trị, văn hóa của Hi Lạp ngày xưa và thủ đô của Hi Lạp ngày nay, là đô thị mang tên nữ thần A-thê-na, và được nữ thần A-thê-na bảo hộ. Con vật gắn bó với nữ thần A-thê-na là con cú mèo. Vì thế, nữ thần thường có những định ngữ kèm theo: A-thê-na có đôi mắt cú mèo, A-thê-na có đôi mắt màu xanh lục... Ngày nay trong văn học các nước Phương Tây, cái tên A-thê-na hoặc Mi-nen-vơ có một nghĩa bóng là: “người đàn bà thông minh”, “người phụ nữ trí tuệ”, “thông tuệ”. Từ đó con cú của nữ thần A-thê-na cũng tượng trưng cho sự hiểu biết, thông minh, trí thức.", "(Trích Thần thoại Hy Lạp, Nguyễn Văn Khỏa, NXB Văn học, 2014, tr.97-98)"], "qs": ["Câu 1. (0,5 điểm) Xác định nhân vật chính của văn bản.", "Câu 2. (0,5 điểm) Theo văn bản, nữ thần A-thê-na được sinh ra trong hoàn cảnh kì lạ như thế nào?", "Câu 3. (1,0 điểm) Nêu ý nghĩa của chi tiết A-thê-na được sinh ra từ đầu của thần Dớt.", "Câu 4. (1,0 điểm) Qua những việc làm của A-thê-na đối với con người, hãy nhận xét vai trò của nữ thần trong đời sống của người Hi Lạp cổ đại.", "Câu 5. (1,0 điểm) Từ văn bản, em rút ra bài học gì có ý nghĩa nhất đối với bản thân? Lí giải ngắn gọn."], "write": ["Viết bài văn nghị luận phân tích, đánh giá chủ đề và những nét đặc sắc về hình thức nghệ thuật của tác phẩm thần thoại Nữ thần A-thê-na."]}, {"num": 4, "title": "NỮ THẦN MẶT TRỜI VA MẶT TRANG", "passage": ["Vua trên trời là Ngọc Hoàng có hai con gái đẹp. Ngọc Hoàng yêu quý hai nàng lắm nên cho các nàng hàng ngày luân phiên nhau đi xem xét mọi việc của hạ giới để báo lại cho nhà Trời. Cô gái đầu tên là Mặt Trời được ngồi kiệu hoa có bốn người khiêng. Bốn người này chia làm hai tốp: một tốp già và một tốp trẻ. Tốp các cụ già khiêng kiệu luôn luôn lo làm tròn phận sự, chăm chỉ vào công việc nên cô Mặt Trời thường đi một vòng rất nhanh. Còn tốp trẻ bản tính la cà nên những lần được phân công khiêng kiệu thường về muộn. Vì thế, mỗi lần Mặt Trời đi với tốp trẻ thì ngày dài, và đi với tốp già thì ngày lại ngắn.", "Mặt Trăng là cô em tính tình nóng nảy còn hơn cả cô chị. Sức nóng của cô đã làm hại cho người và muôn vật khá nhiều. Ấy thế mà cô vẫn cứ chỏng lỏn, đi đâu cũng sà vào khiến cho nhân dân vô cùng kinh hãi. Trần gian khổ sở vì cô Mặt Trăng, họ đã kêu ca rất nhiều, tiếng thấu lên Thượng giới khiến cho bà mẹ đã định lấy tro mà bôi lên mặt cô để giảm bớt sức nóng đi. Nhưng Ngọc Hoàng chiều con, nên không để cho vợ làm việc ấy.", "Bấy giờ ở dưới trần có một chàng trai tên là Quải. Quải là con mồ côi nhưng lại có một thân thể cực kỳ to lớn và sức khỏe tuyệt vời. Trước những hành động tai ác của cô Mặt Trăng, Quải quyết tâm trị cho một mẻ. Anh ta đón đường cô Trăng trên một đỉnh núi cao và trữ sẵn một đống cát thật lớn. Hôm ấy, cô Mặt Trăng vẫn quen thói cũ vừa đi vừa sà xuống để nhìn muôn vật, Quải chờ cho cô ta đến gần rồi bất thình lình bốc cát ném túi bụi vào mắt, vào mặt mũi cô. Cô Trăng đang rong chơi, bị tấn công đột ngột, nhắm mắt lại nhưng đất đã dính đầy mặt và chui cả vào trong mắt. Cô ta hốt hoảng vội vụt bay lên cao, lảng ra xa chỗ Quải đứng.", "Từ đó trở đi cô không dám sà xuống gần mặt đất nữa. Mặt mũi cô bị cát dính chặt nên không còn sáng được như xưa. Sau này tính tình của cô trở nên dịu dàng, hiền lành hơn, ở dưới trần ai cũng thích. Người ta nói mỗi lần cô ngoảnh mặt xuống nhân gian thì lúc đó là trăng rằm, cô quay lưng tức là ba mươi, mùng một, còn cô trở sang trái, sang phải tức là thời kỳ trăng hạ huyền hoặc thượng huyền. Còn những khi trăng quầng, ấy là lúc cát bụi trát mặt bị gió thổi bay tung ra.", "Lại nói chuyện chồng của hai nữ thần này. Đó là một con gấu rất to khoẻ. Không rõ gấu từ đâu đến và Ngọc Hoàng đã gả các cô con gái của mình cho gấu từ abo giờ. Chỉ biết rằng gấu rất hay ghen nên theo dõi sự đi lại của hai vợ mình rất chặt chẽ. Thỉnh thoảng, gấu lại đòi chung tình với một người. Lúc đó là lúc ở dưới trần gian thường gọi là nhật thực hay nguyệt thực. Gặp những ngày này, nhân gian lại phải đánh chiêng, đánh trống rầm rĩ để cho gấu sợ mà lui ra mau. Vì gấu làm như vậy thì có hại cho mùa màng và các nữ thần này cũng vì vậy mà xao nhãng công việc.", "(Theo Viện Văn học, Tuyển tập văn học dân gian Việt Nam, tập 1 : Thần thoại – truyền thuyết, NXB Giáo dục, 1999)"], "qs": ["Câu 1. (0,5 điểm) Xác định không gian được nhắc đến trong văn bản.", "Câu 2. (0,5 điểm) Theo văn bản, vì sao có những ngày ở trần gian được gọi là nhật thực hoặc nguyệt thực?", "Câu 3. (1,0 điểm) Phân tích đặc điểm của nhân vật Quải được thể hiện qua hành động đối phó với nữ thần Mặt Trăng. Qua đó, nhận xét vai trò của nhân vật này trong câu chuyện.", "Câu 4. (1,0 điểm) Văn bản đã giải thích những hiện tượng tự nhiên nào bằng trí tưởng tượng của người xưa? Cách giải thích ấy cho thấy điều gì về nhận thức của người xưa đối với thế giới tự nhiên?", "Câu 5. (1,0 điểm) Từ câu chuyện về nữ thần Mặt Trăng và chàng trai Quải, anh/chị rút ra được bài học gì có ý nghĩa nhất đối với bản thân? Lí giải ngắn gọn."], "write": ["Viết bài văn nghị luận phân tích, đánh giá chủ đề và những nét đặc sắc về hình thức nghệ thuật của truyện thần thoại Nữ thần Mặt Trời và Mặt Trăng."]}, {"num": 5, "title": "THẦN MƯA", "passage": ["Thần Mưa là vị thần hình rồng, thường bay xuống hạ giới hút nước biển, nước sông vào bụng rồi bay lên trời cao phun nước ra làm mưa cho thế gian có nước uống và cày cấy, cây cỏ trên mặt đất được tốt tươi. Thần Mưa thường theo lệnh Trời đi phân phát nước ở các nơi. Thần Mưa có tính hay quên, có vùng cả năm không đến, sinh ra hạn hán ở hạ giới, có vùng lại đến luôn, làm thành lụt lội. Do đó mà có lần người ở hạ giới phải lên kiện Trời vì Thần Mưa vắng mặt lâu ngày.", "Công việc phân phối nước cho khắp mặt đất rất nặng nề, một mình thần Mưa có khi không làm hết, nên có lần trời mở một cuộc thi chọn các giống thủy tộc có tài trở thành rồng hút nước phun mưa để giúp sức thần Mưa. (…) Khi chiếu Trời ban xuống dưới Thuỷ phủ, vua Thuỷ Tề loan báo cho các giống dưới nước ganh đua nhau mà dự thi. Trời cắt một viên Ngự sử ra sát hạch. Hạch có ba kỳ, mỗi kỳ vượt qua một đợt sóng, con vật nào đủ sức đủ tài, vượt được cả ba đợt, thì mới lấy đỗ mà cho hóa rồng. Trong một tháng trời, bao nhiêu loài thủy tộc đến thi đều bị loại cả, vì không con nào vượt qua được cả ba đợt sóng. Có con cá rô nhảy qua được một đợt thì bị rơi ngay, nên chỉ có một điểm. Có con tôm nhảy qua được hai đợt, ruột, gan, vây, vẩy, râu, đuôi đã gần hóa rồng, nhưng đến lượt thứ ba thì đuối sức ngã bổ xuống, lưng cong khoăm lại và cứt lộn lên đầu. Hai con cùng phải trở lại yên nghiệp ở đồng như trước. Đến lượt cá chép vào thi thì bỗng gió thổi ào ào, mây kéo đầy trời, chép vượt luôn một hồi qua ba đợt sóng, lọt vào cửa Vũ Môn. Cá chép đỗ, vây, đuôi, râu, sừng tự nhiên mọc đủ, dạng bộ oai nghi, cá chép hóa rồng phun nước làm ra mưa. Bởi vậy, về sau người ta có câu ví rằng:", "Gái ngoan lấy được chồng khôn,", "Cầm như cá vượt Vũ Môn hóa rồng.", "(Theo Hoàng Minh, Việt Dũng, Thu Nga, Thần thoại Việt Nam chọn lọc, NXB Thanh niên, 2019)"], "qs": ["Câu 1. Xác định không gian, thời gian trong truyện.", "Câu 2. Tìm chi tiết trong văn bản thể hiện công việc của Thần Mưa.", "Câu 3. Anh/Chị hiểu như thế nào về câu ví ở cuối văn bản? Gái ngoan lấy được chồng khôn, Cầm như cá vượt Vũ Môn hóa rồng.", "Câu 4. Chi tiết Cá chép vượt Vũ Môn hóa Rồng gợi cho anh/chị suy nghĩ gì?", "Câu 5. Theo anh/chị, tác giả dân gian đã gửi gắm những khát vọng gì qua văn bản Thần Mưa?"], "write": ["Viết một bài văn nghị luận phân tích, đánh giá chủ đề và những đặc sắc về nghệ thuật của văn bản Thần Mưa."]}, {"num": 6, "title": "Nữ thần Lúa là một cô gái xinh đẹp, dáng người ẻo lả và có tính hay hờn dỗi.", "passage": ["Nàng là con gái Ngọc Hoàng. Sau những trận lụt lội ghê gớm xảy ra, sinh linh cây cỏ đều bị diệt hết, trời bèn cho những người còn sống sót sinh con đẻ cái trên mặt đất và sai Nữ thần Lúa xuống trần gian, nuôi sống loài người.", "Nữ thần làm phép cho những hạt giống gieo xuống đất nảy mầm, mọc thành cây, kết bông mẩy hạt. Lúa chín tự về nhà không cần gặt và không phải phơi phóng gì cả. Cần ăn, cứ ngắt bông bỏ vào nồi là lúa sẽ thành cơm.", "Một hôm, cô con gái nhà kia đang bận việc. Sân chưa quét dọn, cửa kho cũng chưa mở, lúa ở ngoài đã ùn ùn kéo về. Cô gái cuống quít và đâm cáu. Sẵn tay đang cầm cái chổi, cô đập vào đầu bông lúa mà mắng:", "– Người ta chưa dọn dẹp xong đã bò về. Gì mà hấp tấp thế.", "Nữ thần Lúa đang dẫn các bông lúa vào sân, thấy sân, đường bẩn thỉu vương đầy rác rưởi đã bực trong lòng, lại bị phang một cán chổi vào đầu, tức lắm. Cả đám lúa đều thốt lên:", "– Muốn mệt thì ta cho mệt luôn. Từ nay mang hái tre, liềm sắc ra cắt, chở ta về.", "Từ đó, nữ thần Lúa dỗi, nhất định không cho lúa bò về nữa. Người trần gian phải xuống tận ruộng lấy từng bông. Thấy vất vả mệt nhọc quá, người ta mới chế ra liềm hái để cắt lúa cho nhanh. Và lúa cũng không tự biến thành cơm nữa, mà phải phơi phóng, xay giã cho ra gạo.", "Sự hờn dỗi của nữ thần Lúa còn đôi khi cay nghiệt hơn nữa. Nữ thần vẫn giận sự phũ phàng của con người, nên nhiều lần đã cấm không cho các bông lúa nảy nở. Có kết hạt thì cũng chỉ là lúa lép mà thôi. Vì thế sau này mỗi lần gặt xong là người trần gian phải làm lễ cúng hồn Lúa, cũng là cúng thần Lúa. Có nơi không gọi như thế thì gọi là cúng cơm mới. Cúng hồn Lúa, cơm mới, do các gia đình tổ chức trong nhà mình.", "Các làng, các bản cũng phải mở những ngày hội chung để cúng thần Lúa. Trong những ngày hội ấy, mở đầu cho các cuộc tế tự và trò vui, thường có một tiết mục hấp dẫn, gọi là “Rước bông lúa”. Các trò Trám (Vĩnh Phú), trò Triêng (Thanh Hóa), trò thổi tù và cây Hồng (Nghệ An, Hà Tĩnh… đều có rước bông lúa như vậy)."], "qs": ["Câu 1. Hãy chỉ ra những dấu hiệu giúp bạn nhận ra “Nữ thần lúa” là một truyện thần thoại?", "Câu 2. Theo văn bản, vì sao Nữ thần Lúa hờn dỗi với con người?", "Câu 3. Nội dung bao quát của văn bản trên?", "Câu 4. Hình tượng nữ thần Lúa phản ánh quan niệm, nhận thức gì của người xưa về thế giới tự nhiên?", "Câu 5. Thông điệp mà người xưa gửi gắm qua câu chuyện này là gì?", "Câu 6. Bạn có nhận xét gì về cách giải thích nguồn gốc cây lúa của người xưa?"], "write": ["Từ ngữ liệu phần Đọc hiểu, anh/chị hãy viết bài văn nghị luận phân tích, đánh giá chủ đề và những nét đặc sắc về hình thức nghệ thuật của truyện “Nữ thần lúa”."]}], "sinh": [{"type": "mc", "num": 1, "q": "Ngành góp phần tạo ra các sản phẩm mới phục vụ cho nhiều lĩnh vực như thực phẩm, y học, chăn nuôi... góp phần nâng cao sức khỏe con người là", "opts": ["Thủy sản.", "Công nghệ thực phẩm.", "Nông nghiệp.", "Công nghệ sinh học."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 2, "q": "Việc xác định được có khoảng 30 000 gen trong DNA của con người có sự hỗ trợ của", "opts": ["Thống kê.", "Tin sinh học.", "Khoa học máy tính.", "Pháp y."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 3, "q": "Thế kỉ XXI được gọi là thế kỉ của ngành", "opts": ["Di truyền học.", "Giãi phẫu học.", "Động vật học.", "Công nghệ sinh học."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 4, "q": "Đạo đức sinh học là", "opts": ["các nguyên tắc cần phải tuân thủ trong nghiên cứu sinh học.", "các chuẩn mực cần được áp dụng trong quá trình nghiên cứu sinh học.", "các nguyên tắc, chuẩn mực đạo đức áp dụng trong các nghiên cứu sinh học liên quan đến đối tượng nghiên cứu là con người.", "các nguyên tắc, chuẩn mực đạo đức áp dụng trong các nghiên cứu sinh học liên quan đến đối tượng nghiên cứu là các loài sinh vật."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 5, "q": "Đâu là phương pháp nghiên cứu sinh học?", "opts": ["Phương pháp quan sát.", "Phương pháp phân tích.", "Phương pháp tìm kiếm thông tin.", "Phương pháp xử lí dữ liệu."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 6, "q": "Thứ tự các bước khi làm việc trong phòng thí nghiệm: (1) Báo cáo kết quả thí nghiệm. (2) Chuẩn bị các thiết bị, dụng cụ, hóa chất và mẫu vật thí nghiệm. (3) Vệ sinh dụng cụ, phòng thí nghiệm. (4) Tiến hành các thí nghiệm theo quy trình và thu thập dữ liệu từ kết quả thí nghiệm.", "opts": ["(1), (2), (3), (4).", "(3), (1), (2), (4).", "(4), (3), (4), (1).", "(2), (4), (1), (3)."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 7, "q": "Để chứng minh cho giả thuyết về vấn đề nghiên cứu cần phải làm gì?", "opts": ["Đặt ra câu hỏi nghiên cứu.", "Xây dựng giả thuyết.", "Thiết kế và tiến hành thực nghiệm.", "Điều tra, khảo sát thực địa các thí nghiệm."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 8, "q": "Bước nào trong tiến trình nghiên cứu Sinh học đưa ra câu hỏi cần kiếm chứng để biết đúng sai?", "opts": ["Quan sát và đặt câu hỏi.", "Thiết kế và tiến hành các thí nghiệm.", "Xây dựng giả thuyết.", "Làm báo cáo kết quả nghiên cứu."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 9, "q": "Thế nào là các cấp tổ chức của thế giới sống?", "opts": ["Là tập hợp các cấp tổ chức nhỏ nhất trong thế giới sống.", "Là tập hợp các cấp tổ chức từ nhỏ nhất đến lớn nhất trong thế giới sống.", "Là tập hợp các cấp tổ chức lớn nhất trong thế giới sống.", "Là đơn vị tổ chức từ cấp nhỏ nhất đến lớn nhất trong thế giới sống."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 10, "q": "Cấp độ tổ chức nhỏ nhất trong cấp độ tổ chức sống là gì?" o là đơn vị có kích thước nhỏ nhất.", "mọi cơ thể sống đều được cấu tạo từ tế bào.", "mọi hoạt động sống đều được thực hiện nhờ tế bào.", "tế bào có chức năng sinh sản."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 19, "q": "Tế bào là đơn vị chức năng của cơ thể vì", "opts": ["tế bào là đơn vị có kích thước nhỏ nhất.", "mọi cơ thể sống đều được cấu tạo từ tế bào.", "mọi hoạt động sống của cơ thể đều được thực hiện nhờ sự hoạt động của tế bào.", "tế bào có chức năng sinh sản."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 20, "q": "Vì sao tế bào được coi là đơn vị cơ bản của sự sống?", "opts": ["Nó có nhiều hình dạng khác nhau để thích nghi với các chức năng khác nhau.", "Nó có đầy đủ hết các loại bào quan cần thiết.", "Nó có thể thực hiện đầy đủ các quá trình sống cơ bản.", "Nó có nhiều kích thước khác nhau để đảm nhiệm các vai trò khác nhau."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 21, "q": "Sắt là thành phần cấu tạo của", "opts": ["insulin.", "hemoglobin.", "hormone.", "amino acid."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 22, "q": "Thiếu một lượng nhỏ lodine chúng ta có thể bị mắc bệnh gì?", "opts": ["Viêm amidan.", "Bướu cổ.", "Đau họng.", "Còi xương."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 23, "q": "Thiếu một lượng Fe trong cơ thể, chúng ta có thể bị mắc bệnh gì?", "opts": ["Thiếu máu.", "Bướu cổ.", "Giảm thị lực.", "Còi xương"], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 24, "q": "Nước là dung môi hoà tan nhiều chất trong cơ thể sống vì chúng có", "opts": ["nhiệt dung riêng cao.", "lực gắn kết.", "nhiệt bay hơi cao.", "tính phân cực."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 25, "q": "Tính phân cực của nước là do", "opts": ["đôi electron trong liên kết O – H ? (1) Động vật (2) Người (3) Thực vật (4) Vi khuẩn (5) Virut (6) Nấm (7) Amip (8) Địa y", "opts": ["(1),(2),(3),(4),(6),(8)", "(1),(2),(3),(6),(8)", "(1),(2),(3),(6),(7),(8)", "(1),(2),(3),(5),(6),(7)"], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 45, "q": "Ở những người thường xuyên uống rượu, tế bào gan sẽ có hệ thống nào phát triển?", "opts": ["Nhân", "Lưới nội chất trơn", "Lưới nội chất hạt", "Lục lạp"], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 46, "q": "Mô tả quá trình sản xuất và vận chuyển một protein tiết ra khỏi tế bào?", "opts": ["Lưới nội chất hạt → Bộ máy Golgi → Túi tiết → Màng tế bào.", "Lưới nội chất trơn → Túi tiết → Bộ máy Golgi → Màng tế bào.", "Nhân → Bộ máy Golgi → Túi tiết → Màng tế bào.", "Ribosome → Bộ máy Golgi → Túi tiết → Màng tế bào."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 47, "q": "Thành phần nào sau đây không thuộc hệ thống nội màng?", "opts": ["Lưới nội chất.", "Bộ máy Golgi.", "Màng sinh chất.", "Ti thể."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 48, "q": "Phân tử RNA sẽ đi qua cấu trúc nào của nhân để đi ra tế bào chất tham gia dịch mã?", "opts": ["hạch nhân.", "lớp kép phospholipid", "lỗ màng nhân", "chất nhiễm sắc"], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 49, "q": "Nhân tế bào chứa chủ yếu là chất nhiễm sắc gồm", "opts": ["DNA + protein.", "lipid + protein.", "RNA + protein.", "carbohydrate + protein."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "mc", "num": 50, "q": "Lưới nội chất có nguồn gốc từ", "opts": ["Nhân tế bào.", "Ti thể, lục lạp.", "Bộ máy Golgi", "Màng sinh chất, màng nhân."], "ans": null, "topic": "Phần A – Trắc nghiệm nhiều lựa chọn"}, {"type": "tf", "num": 1, "q": "Một nhà nghiên cứu tiến hành quan sát hai tế bào nhân thực: tế bào A có nhân nguyên vẹn, tế bào B bị loại bỏ nhân. Sau một thời gian, tế bào B dần mất khả năng duy trì các hoạt động sống bình thường. Hãy xác định các phát biểu sau là đúng hay sai:", "items": [{"t": "Trong nhân tế bào nhân thực có chứa DNA – vật chất mang thông tin di truyền của tế bào.", "a": null}, {"t": "Nhân được xem là trung tâm thông tin của tế bào vì DNA trong nhân chứa thông tin quy định nhiều đặc điểm cấu trúc và hoạt động của tế bào.", "a": null}, {"t": "Khi mất nhân, tế bào B lập tức ngừng hoàn toàn mọi hoạt động sống vì tất cả các quá trình chuyển hóa đều phải diễn ra trong nhân.", "a": null}, {"t": "Nếu tế bào B vẫn còn các protein và bào quan cần thiết ngay sau khi mất nhân, tế bào có thể tiếp tục duy trì một số hoạt động trong thời gian nhất định; tuy nhiên, về lâu dài khả năng tổng hợp các protein mới và điều hòa hoạt động tế bào sẽ bị suy giảm nghiêm trọng.", "a": null}], "topic": "Phần A – Đúng–sai"}, {"type": "tf", "num": 2, "q": "Khi nói về chức năng của protein, mỗi phát biểu nào sau đây đúng hay sai?", "items": [{"t": "Tham gia cấu tạo nên chất nguyên sinh, các bào quan, màng tế bào.", "a": null}, {"t": "Cấu trúc nên enzyme, hormone, kháng thể.", "a": null}, {"t": "Lưu trữ và truyền đạt thông tin di truyền.", "a": null}, {"t": "Thực hiện việc vận chuyển các chất, co cơ, thu nhận thông tin.", "a": null}], "topic": "Phần A – Đúng–sai"}, {"type": "tf", "num": 3, "q": "Khi nói về đặc điểm chung của carbohydrate, mỗi phát biểu nào sau đây đúng hay sai?", "items": [{"t": "Được cấu tạo từ các nguyên tố C, H, O.", "a": null}, {"t": "Cấu tạo theo nguyên tắc đa phân.", "a": null}, {"t": "Đa số có vị ngọt, tan trong nước, một số có tính khử.", "a": null}, {"t": "Không cấu tạo theo nguyên tắc đa phân.", "a": null}], "topic": "Phần A – Đúng–sai"}, {"type": "tf", "num": 4, "q": "Khi so sánh giữa carbohydrate và lipid, mỗi phát biểu nào sau đây đúng hay sai?", "items": [{"t": "Lipid có tính kị nước hoàn toàn, trong khi một số carbohydrate có tính ưa nước.", "a": null}, {"t": "Các dạng lipid đều không tan trong nước, các dạng carbohydrate đều tan trong nước.", "a": null}, {"t": "Lipid dự trữ nhiều năng lượng hơn so với carbohydrate.", "a": null}, {"t": "Tế bào có thể sử dụng cả hai nhóm chất để cung cấp năng lượng cho các hoạt động sống.", "a": null}], "topic": "Phần A – Đúng–sai"}, {"type": "tf", "num": 5, "q": "Khi nói về đặc điểm của tế bào nhân thực, mỗi đặc điểm sau đây đúng hay sai ?", "items": [{"t": "Kích thước lớn (10 – 100 µm).", "a": null}, {"t": "Có hệ thống nội màng chia tế bào chất thành các xoang riêng biệt.", "a": null}, {"t": "Có các bào quan có màng bao bọc.", "a": null}, {"t": "Gồm tế bào động vật, thực vật, vi khuẩn và nấm.", "a": null}, {"t": "Có nhân và màng nhân hoàn chỉnh (nhân có màng nhân bao bọc).", "a": null}], "topic": "Phần A – Đúng–sai"}, {"type": "tf", "num": 6, "q": "Một tế bào nhân thực có nhân được bao bọc bởi màng nhân. Dựa vào đặc điểm cấu tạo và chức năng của nhân, hãy xác định các phát biểu sau là đúng hay sai:", "items": [{"t": "Nhân tế bào là nơi chứa phần lớn vật chất di truyền của tế bào nhân thực.", "a": null}, {"t": "Màng nhân có cấu tạo gồm hai lớp màng và có các lỗ nhân, giúp trao đổi một số chất giữa nhân và tế bào chất.", "a": null}, {"t": "Nhân có vai trò điều khiển mọi hoạt động của tế bào vì tất cả các hoạt động sống của tế bào đều diễn ra trực tiếp bên trong nhân.", "a": null}, {"t": "Một chất làm các lỗ nhân mất khả năng vận chuyển RNA từ nhân ra tế bào chất. Nếu tác động này kéo dài, quá trình tổng hợp protein của tế bào có thể bị ảnh hưởng do thông tin di truyền không được truyền đầy đủ từ nhân ra tế bào chất.", "a": null}], "topic": "Phần A – Đúng–sai"}, {"type": "sa", "num": 1, "q": "Cho các hiện tượng sau, có mấy hiện tượng thể hiện tính liên kết của các phân tử nước?\n(1) Con gọng vó có thể đứng và chạy trên mặt nước\n(2) Nước được vận chuyển từ rễ qua thân lên lá cây\n(3) Người toát mồ hôi khi trời nóng\n(4) Sợi bông hút nước", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 2, "q": "Có bao nhiêu phát biểu dưới đây đúng khi nói về vai trò của nước?\n(1) Các phân tử nước liên kết với nhau bằng liên kết hydrogen tạo nên sức căng bề mặt, giúp một số\nloài vật nhỏ có thể đứng và di chuyển trên mặt nước\n(2) Người ta không bỏ hoa quả, rau xanh, thịt tươi trong ngăn đá của tủ lạnh vì nhiệt độ thấp sẽ làm\ncho các chất dinh dưỡng bị phân hủy.\n(3) Khi làm đá trong tủ lạnh người ta không đổ nước tràn cốc vì khi đông đá thì thể tích của nước tăng\nlên phá vỡ thể cốc, đặc biệt là cốc thủy tinh.\n(4) Một trong những nguyên nhân giúp nước tạo nên cột nước liên tục giúp nước được vận chuyển từ\nrễ lên lá là do tính phân cực và khả năng liên kết của nước vào thành tế bào.", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 3, "q": "Có bao nhiêu đặc điểm sau đây có thể dùng để phân biệt carbohydrate và lipid ?\nI. Lipid không tan trong nước còn carbohydrate tan trong nước.\nII. Lipid cung cấp nhiều năng lượng hơn carbohydrate khi phân hủy.\nIII. Phân tử lipid có nhiều liên kết este còn giữa các đơn phân của carbohydrate là liên kết glicosidic.\nIV. Phân tử lipid có tỉ lệ oxygen ít hơn đại đa số phân tử carbohydrate.\nV. Lipid có vai trò điều hòa và giữ nhiệt cho cơ thể tốt hơn carbohydrate.", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 4, "q": "Khi nói về đặc điểm của tế bào nhân thực, có bao nhiêu đặc điểm sau đây đúng?\n(1) Kích thước lớn (10 – 100 µm).\n(2) Có hệ thống nội màng chia tế bào chất thành các xoang riêng biệt.\n(3) Có các bào quan có màng bao bọc.\n(4) Gồm tế bào động vật, thực vật, vi khuẩn và nấm.", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 5, "q": "Có bao đặc điểm sau đây chỉ có ở tổ chức sống mà không có ở vật vô sinh?\n(1) Tổ chức theo nguyên tắc thứ bậc. (2) Là hệ kín, có tính ổn định và bền vững.\n(3) Liên tục tiến hóa. (4) Là hệ mở, có khả năng tự điều chỉnh.\n(5) Có khả năng cảm ứng và vận động. (6) Thường xuyên trao đổi chất với môi trường.", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 6, "q": "Cho các đặc điểm sau, khi nói về vi khuẩn:(1). Cơ thể được cấu tạo từ 1 tế bào nhân sơ; (2).\nTế bào chưa có màng bao bọc; (3). Cơ thể có thể có vỏ nhầy để bảo vệ; (4). Không có ti thể nên không\nxảy ra hô hấp. Có bao nhiêu đặc điểm sau đây đúng?", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 7, "q": "Một khu rừng nhiệt đới có nhiều loài cây, động vật, nấm và vi sinh vật. Các sinh vật tương tác\nvới nhau đồng thời chịu tác động của ánh sáng, nhiệt độ, nước, đất và các yếu tố môi trường khác.\nCho các phát biểu sau hãy xác định có bao nhiêu phát biểu đúng :\n(1) Các cấp độ tổ chức sống được tổ chức theo nguyên tắc thứ bậc, trong đó cấp độ lớn hơn được\nhình thành từ sự tập hợp của các cấp độ nhỏ hơn.\n(2) Đặc tính của cấp độ tổ chức sống cao hơn luôn chỉ là tổng các đặc tính của các đơn vị cấu tạo nên\nnó.\n(3) Các cấp độ tổ chức sống có mối quan hệ tương tác với nhau, trong đó sự biến đổi ở một cấp độ\ncó thể ảnh hưởng đến các cấp độ khác.\n(4) Quần xã sinh vật trong khu rừng gồm các quần thể của các loài khác nhau cùng tồn tại và tương\ntác với nhau.\n(5) Nếu một loài cây trong rừng bị suy giảm nghiêm trọng về số lượng, điều này có thể làm thay đổi\nnguồn thức ăn hoặc nơi cư trú của một số loài khác trong quần xã.\n(6) Nếu loại bỏ hoàn toàn đất, nước và ánh sáng khỏi hệ thống trên nhưng các quần thể sinh vật vẫn\ncòn tồn tại thìkhu rừng vẫn được xem là một hệ sinh thái hoàn chỉnh.", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 8, "q": "Một tế bào được đặt trong điều kiện môi trường có nhiệt độ và thành phần chất tan thay đổi.\nDựa vào kiến thức về cấu tạo, tính chất và vai trò của nước, hãy xác định có bao nhiêu phát biểu\nđúng:\n(1) Trong một phân tử nước, nguyên tử oxygen liên kết với hai nguyên tử hydrogen bằng các liên kết\ncộng hóa trị.\n(2) Phân tử nước có tính phân cực vì oxygen có khả năng hút electron mạnh hơn hydrogen, làm cho\nelectron trong các liên kết O–H bị lệch về phía oxygen.\n(3) Các phân tử nước có thể liên kết với nhau bằng liên kết hydrogen, góp phần tạo nên một số tính\nchất đặc biệt của nước.\n(4) Do có tính phân cực, nước có khả năng hòa tan nhiều chất phân cực và chất ion, vì vậy nước là\ndung môi quan trọng trong tế bào.\n(5) Khi nhiệt độ môi trường tăng, nước trong cơ thể sinh vật có thể bay hơi và lấy đi một lượng nhiệt\nđáng kể, góp phần làm giảm nhiệt độ của cơ thể.\n(6) Nếu tế bào bị mất một lượng nước đáng kể nhưng nồng độ các chất tan trong tế bào không thay\nđổi, các phản ứng sinh hóa vẫn diễn ra bình thường vì nước chỉ có vai trò là dung môi, không tham\ngia trực tiếp vào các phản ứng chuyển hóa.", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 9, "q": "Cho các phát biểu sau về tế bào nhân sơ hãy lựa chọn có bao nhiêu phát biểu đúng :\n(1) Tế bào nhân sơ có kích thước thường nhỏ hơn tế bào nhân thực và chưa có nhân được bao bọc\nbởi màng nhân.\n(2) Vùng nhân của tế bào nhân sơ chứa phân tử DNA, thường là DNA dạng vòng và không được bao\nbọc bởi màng nhân.\n(3) Tế bào nhân sơ không có bất kỳ loại bào quan nào vì chúng có cấu tạo đơn giản hơn tế bào nhân\nthực.\n(4) Thành tế bào của phần lớn vi khuẩn được cấu tạo chủ yếu từ peptidoglycan, có vai trò bảo vệ và\nduy trì hình dạng tế bào.\n(5) Ribosome của tế bào nhân sơ có chức năng tổng hợp protein và được cấu tạo từ rRNA cùng\nprotein.\n(6) Nếu thành tế bào của một vi khuẩn bị phá hủy nhưng màng sinh chất vẫn còn nguyên vẹn, tế bào\nchắc chắn vẫn duy trì được hình dạng ban đầu vì màng sinh chất có chức năng nâng đỡ và bảo vệ\nchủ yếu cho tế bào.", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "sa", "num": 10, "q": "Một tế bào nhân thực đang tổng hợp nhiều loại protein khác nhau để phục vụ các hoạt động\nsống. Dựa vào kiến thức về ribosome, hãy xác định có bao nhiêu phát biểu sau là đúng:\n(1) Ribosome là bào quan có ở cả tế bào nhân sơ và tế bào nhân thực.\n(2) Ribosome đọc trình tự nucleotide trên mRNA để xác định trình tự amino acid trong chuỗi\npolypeptide được tổng hợp.\n(3) Các ribosome liên kết với lưới nội chất hạt thường tham gia tổng hợp các protein được tiết ra\nngoài tế bào, protein của màng hoặc protein của một số bào quan thuộc hệ thống nội màng.\n(4) Protein được tổng hợp bởi ribosome tự do luôn được sử dụng ngay trong tế bào chất và không thể\nđược vận chuyển đến bất kỳ bào quan nào khác.\n(5) Một tế bào có tốc độ tổng hợp protein rất cao thường cần có số lượng ribosome lớn để đáp ứng\nnhu cầu tổng hợp protein của tế bào.\n(6) Nếu ribosome của một tế bào bị bất hoạt hoàn toàn nhưng DNA và mRNA vẫn còn nguyên vẹn,\ntế bào vẫn có thể tổng hợp protein bình thường vì thông tin để tạo protein đã được lưu trữ trong\nDNA và truyền trên mRNA.", "guide": [], "topic": "Phần A – Trả lời ngắn"}, {"type": "es", "num": 1, "q": "Một phân tử DNA có chiều dài 3 400 Å. Biết rằng trong phân tử DNA, số nucleotide loại G\nchiếm 20% tổng số nucleotide.\na) Tính tổng số nucleotide của phân tử DNA.\nb) Xác định số nucleotide mỗi loại A, T, G và C.\nc) Tính số liên kết hydrogen của phân tử DNA.", "guide": [], "topic": "Phần B – Tự luận"}, {"type": "es", "num": 2, "q": "Một phân tử DNA có chiều dài 4080 A0 và có số nucleotide loại A bằng 2/3 số nucleotide loại G. Hãy xác định a. Tổng số nucleotide và số nucleotide từng loại của phân tử DNA. b. Khối lượng, số chu kì xoắn và số liên kết hydrogen của phân tử DNA. c. Tổng số liên kết cộng hóa trị, số liên kết cộng hóa trị giữa các nucleotide của phân tử DNA.", "guide": [], "topic": "Phần B – Tự luận"}, {"type": "es", "num": 3, "q": "Vì sao các nhà dinh dưỡng học khuyên rằng “nên thường xuyên thay đổi các món ăn giữa các bữa ăn và trong một bữa ăn phải ăn nhiều món”?", "guide": ["• Trong mỗi loại thức ăn chỉ chứa một số chất dinh dưỡng nhất định, không loại nào có đủ toàn", "bộ các chất cần thiết cho cơ thể.", "• Các chất dinh dưỡng như glucid, lipid, protein, vitamin, muối khoáng và nước đều cần thiết", "cho hoạt động sống.", "• Mỗi loại thực phẩm cung cấp tỉ lệ và loại amino acid, acid béo, vitamin và khoáng khác nhau.", "Kết luận: Cần ăn đa dạng và thay đổi món ăn để:", "1. Cung cấp đầy đủ và cân đối các chất dinh dưỡng cho cơ thể.", "2. Giúp tăng cảm giác ngon miệng, kích thích tiêu hóa.", "3. Phòng tránh thiếu hụt hoặc dư thừa dinh dưỡng do ăn lệch một nhóm thực phẩm."], "topic": "Phần B – Tự luận"}, {"type": "es", "num": 4, "q": "Vào những ngày thời tiết nắng nóng, một người lao động ngoài trời thường phải hoạt động\ntrong nhiều giờ. Sau một thời gian, người này cảm thấy khát nước, mệt mỏi và giảm khả năng làm\nviệc.\na) Giải thích vì sao cơ thể cần được cung cấp đủ nước, đặc biệt khi hoạt động trong điều kiện nhiệt\nđộ cao.\nb) Dựa vào tính chất của nước, giải thích tại sao nước có vai trò quan trọng trong điều hòa nhiệt độ\ncơ thể.", "guide": ["a) Nước là thành phần chủ yếu của cơ thể, là dung môi và môi trường cho nhiều phản ứng sinh", "hóa, đồng thời tham gia vận chuyển các chất. Khi hoạt động trong thời tiết nóng, cơ thể mất", "nhiều nước qua mồ hôi và hô hấp. Nếu không được bổ sung đủ nước → mất nước, giảm thể", "tích dịch cơ thể và ảnh hưởng hoạt động sinh lí → khát, mệt mỏi, giảm khả năng làm việc.", "b) Nước có nhiệt dung riêng cao, nên có khả năng hấp thụ một lượng nhiệt lớn mà nhiệt độ tăng", "không quá nhanh. Nước còn có nhiệt hóa hơi cao; khi mồ hôi bay hơi, nước lấy đi một lượng", "nhiệt đáng kể khỏi cơ thể.", "→ Vì vậy, nước giúp duy trì và điều hòa nhiệt độ cơ thể."], "topic": "Phần B – Tự luận"}, {"type": "es", "num": 5, "q": "Một hộ gia đình nuôi cá trong ao. Trong thời gian gần đây, người dân thường xuyên sử dụng\nphân bón và một số chất xử lí ao không đúng liều lượng. Sau một thời gian, nước ao xuất hiện hiện\ntượng tảo phát triển mạnh, cá nổi lên mặt nước và chết hàng loạt.\na) Ao nuôi cá trong trường hợp trên được xem là cấp độ tổ chức sống nào? Nêu các thành phần chính\ncấu tạo nên cấp độ tổ chức đó.\nb) Giải thích vì sao sự gia tăng quá mức của tảo có thể dẫn đến hiện tượng cá chết.", "guide": ["a) Ao nuôi cá là một hệ sinh thái. Hệ sinh thái gồm quần xã sinh vật (cá, tảo, vi sinh vật...) và", "sinh cảnh (nước, ánh sáng, nhiệt độ, các chất vô cơ...).", "b) Khi tảo bùng nổ phủ kín mặt nước sẽ ngăn cản ánh sáng mặt trời chiếu xuống, làm các lớp tảo", "và thực vật thủy sinh ở tầng dưới không quang hợp được và chết đi.", "Quá trình phân hủy xác tảo chết bởi các vi sinh vật hiếu khí diễn ra mạnh mẽ, tiêu thụ một", "lượng rất lớn oxygen hòa tan trong ao. Đồng thời, vào ban đêm, lượng tảo sống hô hấp cũng", "lấy đi nhiều oxygen, dẫn đến tình trạng ao bị thiếu hụt oxygen trầm trọng làm cá nổi đầu và", "chết hàng loạt."], "topic": "Phần B – Tự luận"}, {"type": "es", "num": 6, "q": "Dựa vào kiến thức về các cấp độ tổ chức của thế giới sống:\na) Nêu nội dung của \"nguyên tắc thứ bậc\" trong tổ chức thế giới sống.\nb) Giải thích vì sao sự thay đổi hoặc tổn thương ở cấp độ tế bào lại có thể dẫn đến sự biến đổi ở cấp\nđộ cơ thể và quần thể sinh vật?", "guide": ["a) Nội dung nguyên tắc thứ bậc", "- Tổ chức sống cấp dưới làm nền tảng cấu tạo nên tổ chức sống cấp trên.", "- Cấp tổ chức cao hơn mang đặc tính nổi trội mà cấp thấp hơn không có.", "b) Tác động từ tế bào đến cơ thể và quần thể", "-Tế bào là đơn vị cấu trúc và chức năng cơ bản; khi tế bào tổn thương sẽ làm suy giảm chức", "năng của mô, cơ quan và toàn bộ cơ thể.", "- Nhiều cơ thể bị ảnh hưởng sẽ làm giảm tỉ lệ sống sót và khả năng sinh sản, dẫn đến biến", "động cấu trúc và số lượng của quần thể.", "……………….. Hết………………….."], "topic": "Phần B – Tự luận"}], "vg": [{"type": "th", "num": 1, "topic": "Ôn tập đọc hiểu – Dạng câu hỏi biện pháp tu từ", "q": "1. Dạng câu hỏi tu từ (Thường xuất hiện một câu trong đề kiểm tra)\n+ Ở mức độ đánh giá nhận biết, học sinh phải xác định được biện pháp tu từ trong ngữ liệu được cho.\n+ Ở mức độ đánh giá thông hiểu, học sinh phải phân tích được tác dụng biện pháp tu từ trong ngữ liệu được cho.\nĐể chinh phục trọn điểm ở phần câu hỏi tu từ, học sinh cần đảm bảo trả lời được các đại ý sau: Trong ngữ liệu đã sử dụng biện pháp tu từ gì? Dấu hiệu nhận biết biện pháp tu từ đó là gì? Tác dụng của biện pháp tu từ về mặt nội dung và nghệ thuật đối với ngữ liệu được cho?\nĐáp án mẫu (dùng để tham khảo):\n- Biện pháp tu từ được sử dụng trong ngữ liệu là: … (so sánh; liệt kê; ẩn dụ; hoán dụ; phép đối; nhân hóa; phép điệp,…).\n- Dấu hiệu nhận biết: … (so sánh hình ảnh “A” và hình ảnh “B” qua từ “như, giống như” (so sánh); liệt kê liên tiếp các hình ảnh “A”, “B”, “C”,… (liệt kê); gọi tên sự vật “A bằng sự vật “B” dựa trên nét tương đồng (ẩn dụ)).\n- Tác dụng của biện pháp tu từ:\n+ Tác dụng nghệ thuật: Tăng sức gợi hình, gợi cảm cho câu văn; Tạo sự sinh động, hấp dẫn cho bài viết.\n+ Tác dụng nội dung: Nhấn mạnh/ làm nổi bật một nội dung (ví dụ: nhấn mạnh sự khổ nghèo của nhân vật A; nhấn mạnh sự lam lũ của nhân vật B; làm nổi bật vẽ đẹp thiên nhiên,..) và thể hiện tư tưởng, tình cảm, thái độ của tác giả (thể hiện sự trân trọng, biết ơn; thể hiện sự câm phẫn; thể hiện sự yêu thương;…).\nVí dụ: Xác định và nêu tác dụng của một biện pháp tu từ được sử dụng trong câu: “Dì khóc nức nở, khóc nấc lên, khóc như người ta thổ” (Dì Hảo, Nam Cao).\nĐáp án:\n- Biện pháp tu từ được sử dụng trong ngữ liệu là: liệt kê.\n- Dấu hiệu nhận biết: Liệt kê các trạng thái của tiếng khóc của nhân vật dì Hảo.\n- Tác dụng của biện pháp tu từ:\n+ Tác dụng nghệ thuật: Tăng sức gợi hình, gợi cảm cho câu văn; Tạo sự sinh động, hấp dẫn cho bài viết.\n+ Tác dụng nội dung: Nhấn mạnh sự uất nghẹn, đau khổ và diễn biến cảm xúc của nhân vật Dì Hảo. Đồng thời thể hiện sự đồng cảm, thương xót của tác giả dành cho nhân vật Dì Hảo nói riêng và những người phụ nữ bạc phận nói chung.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 2, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp So sánh. Dấu hiệu nhận biết: Có từ so sánh (như, là, tựa, hơn, chẳng bằng...) nối giữa hai vế A và B. Tác dụng chính: Cụ thể hóa sự vật, giúp người đọc dễ hình dung; tăng sức gợi hình, gợi cảm.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 3, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Ẩn dụ. Dấu hiệu nhận biết: Gọi tên sự vật A bằng tên sự vật B dựa trên nét tương đồng (giống nhau). Tác dụng chính: Tăng tính hàm súc, tạo chiều sâu cảm xúc và sức liên tưởng mẻ cho câu văn.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 4, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Hoán dụ. Dấu hiệu nhận biết: Gọi tên sự vật A bằng tên sự vật B dựa trên nét tương cận (gần gũi, đi đôi). Tác dụng chính: Nhấn mạnh đặc điểm nổi bật của đối tượng; tạo cách diễn đạt sinh động, ngắn gọn.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 5, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Nhân hóa. Dấu hiệu nhận biết: Dùng từ ngữ chỉ hoạt động, tính chất, tên gọi của người cho vật. Tác dụng chính: Làm sự vật trở nên gần gũi, có tâm hồn và sức sống như con người.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 6, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Điệp ngữ. Dấu hiệu nhận biết: Lặp lại từ, cụm từ hoặc cấu trúc câu nhiều lần trong một đoạn. Tác dụng chính: Nhấn mạnh ý đồ của tác giả; tạo nhịp điệu (nhạc tính) dồn dập hoặc da diết.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 7, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Liệt kê. Dấu hiệu nhận biết: Sắp xếp nối tiếp các từ, cụm từ cùng loại (thường dùng dấu phẩy). Tác dụng chính: Diễn đạt đầy đủ, chi tiết các khía cạnh; cho thấy sự phong phú, đa dạng.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 8, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Nói quá. Dấu hiệu nhận biết: Phóng đại quy mô, tính chất của sự vật so với thực tế. Tác dụng chính: Gây ấn tượng mạnh, nhấn mạnh bản chất của sự việc hoặc tạo tiếng cười.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 9, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Nói giảm. Dấu hiệu nhận biết: Dùng cách nói tế nhị, tránh gọi trực tiếp tên sự việc đau buồn, thô tục. Tác dụng chính: Giảm nhẹ cảm giác đau thương, ghê sợ; thể hiện thái độ lịch sự, trân trọng.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 10, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Câu hỏi tu từ. Dấu hiệu nhận biết: Hình thức là câu hỏi nhưng không dùng để hỏi mà để khẳng định. Tác dụng chính: Bộc lộ cảm xúc, khơi gợi sự suy ngẫm của người đọc một cách sâu sắc.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 11, "topic": "Ôn tập đọc hiểu – Bảng hệ thống hóa biện pháp tu từ", "q": "Biện pháp Phép Đối. Dấu hiệu nhận biết: Hai vế câu có độ dài tương đương nhau (cân xứng). Các từ ở vị trí tương ứng thường cùng từ loại (danh từ đối danh từ, động từ đối động từ). Tác dụng chính: Tạo sự cân đối, hài hòa và nhạc tính. Nhấn mạnh sự tương phản cực độ hoặc sự hô ứng, nhằm khẳng định một chân lý, một tình cảm.", "src": "Đề_Cương.docx"}, {"type": "th", "num": 12, "topic": "Ôn tập đọc hiểu – Dạng rút ra bài học", "q": "2. Dạng Bài Rút Ra Bài Học Từ Văn Bản\nỞ mức độ nhận biết: Học sinh xác định được thông điệp/ bài học trực tiếp có sẵn trong văn bản (thường nằm ở câu kết hoặc lời thoại nhân vật).\n- Ở mức độ Thông hiểu: Học sinh diễn giải được ý nghĩa của bài học đó dựa trên nội dung văn bản.\n- Ở mức độ Vận dụng: Học sinh tự rút ra bài học sâu sắc nhất đối với bản thân và giải thích lý do vì sao bài học đó có giá trị.\nĐể đạt điểm tối đa, câu trả lời cần đảm bảo cấu trúc 3 phần: Nêu bài học - Giải thích bài học - Liên hệ giá trị thực tiễn:\n+ Bước 1: Nêu rõ bài học. (Cần ngắn gọn, súc tích, mang tính khái quát);\n+ Bước 2: Giải thích vì sao rút ra bài học đó. (Dựa trên chi tiết trong văn bản để lập luận);\n+ Bước 3: Ý nghĩa/Tác dụng của bài học. (Bài học đó giúp thay đổi nhận thức, hành động hoặc bồi đắp tình cảm gì cho con người?).\nĐáp án mẫu (Dùng để tham khảo)\nBài học sâu sắc nhất mà tôi rút ra từ văn bản là1: ... (Ví dụ: Bài học về sự kiên trì; bài học về lòng biết ơn; bài học về sự tử tế...). Lý do rút ra bài học2: Bởi vì qua câu chuyện/hình ảnh của nhân vật “A”, chúng ta thấy rằng... (tóm tắt ngắn gọn ý nghĩa từ văn bản dẫn đến bài học). Giá trị của bài học: Về nhận thức3: Giúp chúng ta hiểu rõ hơn về giá trị của... (sự nỗ lực/tình thân/lẽ sống...); Về hành động4: Nhắc nhở mỗi người cần phải... (biết lắng nghe/không bỏ cuộc/trân trọng những gì đang có...) để cuộc sống trở nên tốt đẹp và ý nghĩa hơn.\nVí dụ: Từ câu văn “Sự kiên trì không khác gì những giọt nước bền bỉ; dẫu đá có cứng đến đâu, qua thời gian, những giọt nước ấy cũng sẽ xuyên thấu và tạc nên những hình hài vĩ đại”, hãy rút ra một bài học mà anh/chị tâm đắc nhất.\nĐáp án:\nBài học sâu sắc nhất mà tôi rút ra từ câu văn “Sự kiên trì không khác gì những giọt nước bền bỉ; dẫu đá có cứng đến đâu, qua thời gian, những giọt nước ấy cũng sẽ xuyên thấu và tạc nên những hình hài vĩ đại” là bài học về sức mạnh của sự kiên trì và bền bỉ trong cuộc sống1. Bởi lẽ, hình ảnh “giọt nước” nhỏ bé nhưng có thể “xuyên thấu đá cứng” cho thấy sức mạnh không nằm ở sự phô trương nhất thời mà nằm ở sự nỗ lực không ngừng nghỉ. Khó khăn dù có lớn như “vách đá” cũng sẽ bị khuất phục bởi ý chí kiên định2. Từ bài học đó, chúng ta có thể nhận ra rằng thành công không đến từ may mắn mà là kết quả của một quá trình rèn luyện bền bỉ3. Đồng thời, sự kiên trì và bền bỉ còn tiếp thêm động lực để chúng ta không nản lòng trước những thử thách hiện tại, thôi thúc mỗi người kiên tâm theo đuổi mục tiêu đến cùng4.", "src": "Đề_Cương.docx"}, {"type": "es", "num": 1, "topic": "Ôn tập đọc hiểu – Bài tập biện pháp tu từ", "q": "Chỉ ra và nêu tác dụng của biện pháp tu từ được sử dụng trong ngữ liệu sau: Kẻ hèn nhát luôn nhìn thấy vực thẳm trong mỗi cơ hội, còn người bản lĩnh lại tìm thấy cầu vồng ngay trong tâm bão.", "guide": ["(Khung đáp án mẫu của đề cương cho dạng này, không phải đáp án riêng của câu)", "- Biện pháp tu từ được sử dụng trong ngữ liệu là: … (so sánh; liệt kê; ẩn dụ; hoán dụ; phép đối; nhân hóa; phép điệp,…).", "- Dấu hiệu nhận biết: … (so sánh hình ảnh “A” và hình ảnh “B” qua từ “như, giống như” (so sánh); liệt kê liên tiếp các hình ảnh “A”, “B”, “C”,… (liệt kê); gọi tên sự vật “A bằng sự vật “B” dựa trên nét tương đồng (ẩn dụ)).", "- Tác dụng của biện pháp tu từ:", "+ Tác dụng nghệ thuật: Tăng sức gợi hình, gợi cảm cho câu văn; Tạo sự sinh động, hấp dẫn cho bài viết.", "+ Tác dụng nội dung: Nhấn mạnh/ làm nổi bật một nội dung (ví dụ: nhấn mạnh sự khổ nghèo của nhân vật A; nhấn mạnh sự lam lũ của nhân vật B; làm nổi bật vẽ đẹp thiên nhiên,..) và thể hiện tư tưởng, tình cảm, thái độ của tác giả (thể hiện sự trân trọng, biết ơn; thể hiện sự câm phẫn; thể hiện sự yêu thương;…)."], "src": "Đề_Cương.docx"}, {"type": "es", "num": 2, "topic": "Ôn tập đọc hiểu – Bài tập biện pháp tu từ", "q": "Chỉ ra và nêu tác dụng của biện pháp tu từ được sử dụng trong ngữ liệu sau: Đợi đến khi hoàn hảo mới bắt đầu, hay bắt đầu để trở nên hoàn hảo, lựa chọn nào sẽ chạm tay vào giấc mơ sớm hơn?", "guide": ["(Khung đáp án mẫu của đề cương cho dạng này, không phải đáp án riêng của câu)", "- Biện pháp tu từ được sử dụng trong ngữ liệu là: … (so sánh; liệt kê; ẩn dụ; hoán dụ; phép đối; nhân hóa; phép điệp,…).", "- Dấu hiệu nhận biết: … (so sánh hình ảnh “A” và hình ảnh “B” qua từ “như, giống như” (so sánh); liệt kê liên tiếp các hình ảnh “A”, “B”, “C”,… (liệt kê); gọi tên sự vật “A bằng sự vật “B” dựa trên nét tương đồng (ẩn dụ)).", "- Tác dụng của biện pháp tu từ:", "+ Tác dụng nghệ thuật: Tăng sức gợi hình, gợi cảm cho câu văn; Tạo sự sinh động, hấp dẫn cho bài viết.", "+ Tác dụng nội dung: Nhấn mạnh/ làm nổi bật một nội dung (ví dụ: nhấn mạnh sự khổ nghèo của nhân vật A; nhấn mạnh sự lam lũ của nhân vật B; làm nổi bật vẽ đẹp thiên nhiên,..) và thể hiện tư tưởng, tình cảm, thái độ của tác giả (thể hiện sự trân trọng, biết ơn; thể hiện sự câm phẫn; thể hiện sự yêu thương;…)."], "src": "Đề_Cương.docx"}, {"type": "es", "num": 3, "topic": "Ôn tập đọc hiểu – Bài tập biện pháp tu từ", "q": "Chỉ ra và nêu tác dụng của biện pháp tu từ được sử dụng trong ngữ liệu sau: Những vấp ngã đầu đời chẳng qua chỉ là chút học phí bạn trả cho trường đời để nhận về tấm bằng mang tên trưởng thành.", "guide": ["(Khung đáp án mẫu của đề cương cho dạng này, không phải đáp án riêng của câu)", "- Biện pháp tu từ được sử dụng trong ngữ liệu là: … (so sánh; liệt kê; ẩn dụ; hoán dụ; phép đối; nhân hóa; phép điệp,…).", "- Dấu hiệu nhận biết: … (so sánh hình ảnh “A” và hình ảnh “B” qua từ “như, giống như” (so sánh); liệt kê liên tiếp các hình ảnh “A”, “B”, “C”,… (liệt kê); gọi tên sự vật “A bằng sự vật “B” dựa trên nét tương đồng (ẩn dụ)).", "- Tác dụng của biện pháp tu từ:", "+ Tác dụng nghệ thuật: Tăng sức gợi hình, gợi cảm cho câu văn; Tạo sự sinh động, hấp dẫn cho bài viết.", "+ Tác dụng nội dung: Nhấn mạnh/ làm nổi bật một nội dung (ví dụ: nhấn mạnh sự khổ nghèo của nhân vật A; nhấn mạnh sự lam lũ của nhân vật B; làm nổi bật vẽ đẹp thiên nhiên,..) và thể hiện tư tưởng, tình cảm, thái độ của tác giả (thể hiện sự trân trọng, biết ơn; thể hiện sự câm phẫn; thể hiện sự yêu thương;…)."], "src": "Đề_Cương.docx"}, {"type": "es", "num": 4, "topic": "Ôn tập đọc hiểu – Bài tập biện pháp tu từ", "q": "Chỉ ra và nêu tác dụng của biện pháp tu từ được sử dụng trong ngữ liệu sau: Ý chí của con người là một kỳ quan có thể san bằng tất cả mọi trở ngại, biến những đỉnh núi cao nhất cũng phải cúi rạp dưới bàn chân người lữ hành.", "guide": ["(Khung đáp án mẫu của đề cương cho dạng này, không phải đáp án riêng của câu)", "- Biện pháp tu từ được sử dụng trong ngữ liệu là: … (so sánh; liệt kê; ẩn dụ; hoán dụ; phép đối; nhân hóa; phép điệp,…).", "- Dấu hiệu nhận biết: … (so sánh hình ảnh “A” và hình ảnh “B” qua từ “như, giống như” (so sánh); liệt kê liên tiếp các hình ảnh “A”, “B”, “C”,… (liệt kê); gọi tên sự vật “A bằng sự vật “B” dựa trên nét tương đồng (ẩn dụ)).", "- hất: Đừng xấu hổ khi không biết, chỉ xấu hổ khi không học.", "guide": ["(Khung đáp án mẫu của đề cương cho dạng này, không phải đáp án riêng của câu)", "Bài học sâu sắc nhất mà tôi rút ra từ văn bản là1: ... (Ví dụ: Bài học về sự kiên trì; bài học về lòng biết ơn; bài học về sự tử tế...). Lý do rút ra bài học2: Bởi vì qua câu chuyện/hình ảnh của nhân vật “A”, chúng ta thấy rằng... (tóm tắt ngắn gọn ý nghĩa từ văn bản dẫn đến bài học). Giá trị của bài học: Về nhận thức3: Giúp chúng ta hiểu rõ hơn về giá trị của... (sự nỗ lực/tình thân/lẽ sống...); Về hành động4: Nhắc nhở mỗi người cần phải... (biết lắng nghe/không bỏ cuộc/trân trọng những gì đang có...) để cuộc sống trở nên tốt đẹp và ý nghĩa hơn.", "Ví dụ: Từ câu văn “Sự kiên trì không khác gì những giọt nước bền bỉ; dẫu đá có cứng đến đâu, qua thời gian, những giọt nước ấy cũng sẽ xuyên thấu và tạc nên những hình hài vĩ đại”, hãy rút ra một bài học mà anh/chị tâm đắc nhất.", "Bài học sâu sắc nhất mà tôi rút ra từ câu văn “Sự kiên trì không khác gì những giọt nước bền bỉ; dẫu đá có cứng đến đâu, qua thời gian, những giọt nước ấy cũng sẽ xuyên thấu và tạc nên những hình hài vĩ đại” là bài học về sức mạnh của sự kiên trì và bền bỉ trong cuộc sống1. Bởi lẽ, hình ảnh “giọt nước” nhỏ bé nhưng có thể “xuyên thấu đá cứng” cho thấy sức mạnh không nằm ở sự phô trương nhất thời mà nằm ở sự nỗ lực không ngừng nghỉ. Khó khăn dù có lớn như “vách đá” cũng sẽ bị khuất phục bởi ý chí kiên định2. Từ bài học đó, chúng ta có thể nhận ra rằng thành công không đến từ may mắn mà là kết quả của một quá trình rèn luyện bền bỉ3. Đồng thời, sự kiên trì và bền bỉ còn tiếp thêm động lực để chúng ta không nản lòng trước những thử thách hiện tại, thôi thúc mỗi người kiên tâm theo đuổi mục tiêu đến cùng4."], "src": "Đề_Cương.docx"}, {"type": "es", "num": 2, "topic": "Ôn tập đọc hiểu – Bài tập rút ra bài học", "q": "Từ câu văn sau, hãy rút ra một bài học mà anh/chị tâm đắc nhất: Bàn tay tặng hoa hồng bao giờ cũng còn vương lại mùi hương", "guide": ["(Khung đáp án mẫu của đề cương cho dạng này, không phải đáp án riêng của câu)", "Bài học sâu sắc nhất mà tôi rút ra từ văn bản là1: ... (Ví dụ: Bài học về sự kiên trì; bài học về lòng biết ơn; bài học về sự tử tế...). Lý do rút ra bài học2: Bởi vì qua câu chuyện/hình ảnh của nhân vật “A”, chúng ta thấy rằng... (tóm tắt ngắn gọn ý nghĩa từ văn bản dẫn đến bài học). Giá trị của bài học: Về nhận thức3: Giúp chúng ta hiểu rõ hơn về giá trị của... (sự nỗ lực/tình thân/lẽ sống...); Về hành động4: Nhắc nhở mỗi người cần phải... (biết lắng nghe/không bỏ cuộc/trân trọng những gì đang có...) để cuộc sống trở nên tốt đẹp và ý nghĩa hơn.", "Ví dụ: Từ câu văn “Sự kiên trì không khác gì những giọt nước bền bỉ; dẫu đá có cứng đến đâu, qua thời gian, những giọt nước ấy cũng sẽ xuyên thấu và tạc nên những hình hài vĩ đại”, hãy rút ra một bài học mà anh/chị tâm đắc nhất.", "Bài học sâu sắc nhất mà tôi rút ra từ câu văn “Sự kiên trì không khác gì những giọt nước bền bỉ; dẫu đá có cứng đến đâu, qua thời gian, những giọt nước ấy cũng sẽ xuyên thấu và tạc nên những hình hài vĩ đại” là bài học về sức mạnh của sự kiên trì và bền bỉ trong cuộc sống1. Bởi lẽ, hình ảnh “giọt nước” nhỏ bé nhưng có thể “xuyên thấu đá cứng” cho thấy sức mạnh không nằm ở sự phô trương nhất thời mà nằm ở sự nỗ lực không ngừng nghỉ. Khó khăn dù có lớn như “vách đá” cũng sẽ bị khuất phục bởi ý chí kiên định2. Từ bài học đó, chúng ta có thể nhận ra rằng thành công không đến từ may mắn mà là kết quả của một quá trình rèn luyện bền bỉ3. Đồng thời, sự kiên trì và bền bỉ còn tiếp thêm động lực để chúng ta không nản lòng trước những thử thách hiện tại, thôi thúc mỗi người kiên tâm theo đuổi mục tiêu đến cùng4."], "src": "Đề_Cương.docx"}, {"type": "es", "num": 3, "topic": "Ôn tập đọc hiểu – Bài tập rút ra bài học", "q": "Từ câu văn sau, hãy rút ra một bài học mà anh/chị tâm đắc nhất: Cành cây khô không thể nở hoa, nhưng nó có thể làm mồi cho một ngọn lửa ấm.", "guide": ["(Khung đáp án mẫu của đề cương cho dạng này, khôn
