 return `<div class="row"><button class="b2" data-a="home">‹ Trang chủ</button><b style="font-size:20px">📊 Hành trình ôn tập của tôi</b></div>
 <div class="grid"><div class="card"><span class="mu">Lượt luyện</span><h2>${h.length}</h2></div><div class="card"><span class="mu">Câu đã làm</span><h2>${tot}</h2></div><div class="card"><span class="mu">Tỉ lệ đúng</span><h2>${tot?Math.round(c/tot*100):0}%</h2></div></div>
 <div class="card"><b>Điểm theo môn</b>${SUBJ.map(([k,n])=>{const x=h.filter(i=>i.s===k);if(!x.length)return'';const p=x.reduce((s,i)=>s+i.c,0)/x.reduce((s,i)=>s+i.n,0);return `<div class="row"><span>${n}</span><span>${(p*10).toFixed(1)}/10</span></div><div class="bar"><i style="width:${p*100}%"></i></div>`}).join('')||'<p class="mu">Chưa có dữ liệu.</p>'}</div>
 <div class="card"><b>Chủ đề cần ôn thêm</b>${wk.map(([t,x])=>`<p>• ${esc(t)} <span class="mu">(sai ${x.w}/${x.r+x.w} lượt)</span></p>`).join('')||'<p class="mu">Chưa có.</p>'}</div>
 <div class="card"><b>Câu thường sai</b>${bad.map(([id,s])=>`<p class="q">• ${esc((byQ(id)||{q:''}).q.slice(0,140))} <span class="mu">(sai ${s.w} lần)</span></p>`).join('')||'<p class="mu">Chưa có.</p>'}
 ${SUBJ.filter(([k])=>Q[k].some(q=>S.wrong[q.id])).map(([k,n])=>`<button class="b1 w" data-a="redoS" data-k="${k}">Ôn lại ${Q[k].filter(q=>S.wrong[q.id]).length} câu chưa nắm – ${n}</button>`).join('')}</div>
 <div class="card"><b>Lịch sử</b>${h.slice(0,15).map(x=>`<p>${SN[x.s]} · ${x.ty==='mc'?'Trắc nghiệm':'Đúng–sai'} · ${x.c}/${x.n} · <span class="mu">${new Date(x.t).toLocaleDateString('vi-VN')}</span></p>`).join('')||'<p class="mu">Chưa có.</p>'}</div>
 <p class="warn">${SYNC?'Tiến độ đã được lưu theo tài khoản của bạn trên máy chủ.':'Tiến độ hiện chỉ lưu trong trình duyệt này; chưa đồng bộ giữa các thiết bị.'} Bảng điểm không được công khai.</p><button class="b2" data-a="reset">Xóa dữ liệu của tôi</button>`}
const ACT={home:()=>go({page:'home'}),me:()=>go({page:'me'}),subj:d=>go({page:'subj',subj:d.k,tab:'dc'}),
 tab:d=>{V.tab=d.k;V.qz=null;V.chat=V.chat;render()},start:d=>start(d.t),quit:()=>{V.qz=null;render()},
 pick:d=>{const u=V.qz.units[V.qz.i];if(V.qz.exam||!isDone(u)){u.a=+d.p;render()}},
 tfp:d=>{const u=V.qz.units[V.qz.i];if(V.qz.exam||u.a[d.i]==null){u.a[d.i]=d.v==='1';render()}},
 prev:()=>{V.qz.i=Math.max(0,V.qz.i-1);render()},next:()=>{V.qz.i=Math.min(V.qz.units.length-1,V.qz.i+1);render()},jump:d=>{V.qz.i=+d.i;render()},
 flag:()=>{V.qz.flag[V.qz.i]=!V.qz.flag[V.qz.i];render()},submit:()=>{const z=V.qz,r=z.units.filter(u=>!isDone(u)).length;if(!r||confirm('Còn '+r+' câu chưa làm. Nộp bài?'))submit()},
 redo:()=>{const z=V.qz,w=z.units.filter(u=>u.o?!(u.a!=null&&isOk(u,0)):!u.idx.every(i=>u.a[i]!=null&&isOk(u,i))).map(u=>u.o?{q:u.q,o:u.o,a:null}:{q:u.q,idx:u.idx,a:{}});V.mode='pr';start(z.type,w)},
 redoS:d=>{go({page:'subj',subj:d.k,tab:'mc'});const w=Q[d.k].filter(q=>S.wrong[q.id]&&ans(q)!=null);const t=w.some(q=>q.type==='mc')?'mc':'tf';V.tab=t;V.mode='pr';
  start(t,t==='mc'?w.filter(q=>q.type==='mc').map(q=>({q,o:q.opts.map((_,i)=>i),a:null})):w.filter(q=>q.type==='tf').map(q=>({q,idx:q.items.map((_,i)=>i),a:{}})))},
 exp:d=>{const z=V.qz,u=z.units[+d.k],q=u.q,el=$('#ex-'+d.k),A=ans(q);
  const you=u.o?(u.a==null?'chưa chọn':'ABCD'[u.a]+'. '+q.opts[u.o[u.a]]):u.idx.map(i=>'abcdef'[i]+':'+(u.a[i]==null?'?':u.a[i]?'Đúng':'Sai')).join(', ');
  const corr=u.o?'ABCD'[A]+'. '+q.opts[A]:u.idx.map(i=>'abcdef'[i]+':'+(A[i]?'Đúng':'Sai')).join(', ');
  aiTo(el,RULE+'TRÍCH ĐOẠN ĐỀ CƯƠNG:\n'+ctxOf([q,...ret(q.subj,q.q,3).filter(x=>x.id!==q.id)])+'\n\nHãy giải thích ngắn gọn cho học sinh: đáp án đúng là '+corr+'; học sinh chọn '+you+'. Nêu kiến thức cần nhớ, cách suy luận, và với nhận định sai thì viết lại cho đúng.')},
 eh:d=>{const e=V.EI[d.k];aiTo($('#eo-'+d.k),RULE+(e.ctx?'NGỮ LIỆU:\n'+e.ctx+'\n\n':'')+'ĐỀ BÀI: '+e.title+'\n\nHãy gợi ý cách làm: dàn ý, các ý cần có, lỗi thường gặp và cách tự kiểm tra. Không viết thay bài hoàn chỉnh.')},
 ef:d=>{const e=V.EI[d.k],v=$('#ta-'+d.k).value.trim();V.tx=V.tx||{};V.tx[d.k]=v;if(v.length<10)return toast('Hãy nhập bài làm trước.');
  aiTo($('#eo-'+d.k),RULE+(e.ctx?'NGỮ LIỆU:\n'+e.ctx+'\n\n':'')+'ĐỀ BÀI: '+e.title+(e.guide&&e.guide.length?'\nGỢI Ý ĐÁP ÁN CỦA ĐỀ CƯƠNG: '+e.guide.join(' '):'')+'\n\nBÀI LÀM CỦA HỌC SINH:\n'+v+'\n\nNhận xét theo từng ý: đã đúng, còn thiếu, cần sửa. Chỉ nêu điểm tham khảo nếu đề có ghi thang điểm; phải ghi rõ đây không phải điểm chính thức của giáo viên.')},
 eg:d=>{const e=V.EI[d.k],el=$('#eo-'+d.k);el.style.display='block';el.textContent='Gợi ý của đề cương:\n'+e.guide.join('\n')},
 ask:()=>{const t=$('#ai-q').value.trim();if(t)ask(t)},
 aq:d=>{const k=V.subj,tp=$('#ai-t').value,L=Q[k].filter(q=>q.topic===tp).slice(0,40);
  if(d.m==='sum')ask('Tóm tắt kiến thức trọng tâm của "'+tp+'" thành các ý ngắn: khái niệm, số liệu, mốc/sự kiện, điều cần nhớ.',L);
  else if(d.m==='gen')ask('Tạo 5 câu trắc nghiệm A–D mới về "'+tp+'", mỗi câu có đáp án, lời giải ngắn và nguồn [số].',L);
  else{const w=Q[k].filter(q=>S.wrong[q.id]).slice(0,10);ask('Dựa trên các câu tôi từng làm sai, chỉ ra chủ đề yếu và gợi ý ôn tiếp theo (bài nào, câu nào trước).',w.length?w:L.slice(0,6))}},
 setk:async d=>{const q=Q[V.subj].find(x=>x.id===d.id);if(q.type==='mc')KEYS[q.id]=+d.i;else{const a=KEYS[q.id]||[];a[+d.i]=d.v==='1';KEYS[q.id]=a}
  try{await DB.collection('keys').doc(V.subj).set(Object.fromEntries(Object.entries(KEYS).filter(([i])=>i.startsWith(V.subj)&&/^\D+\d+$/.test(i)&&i.replace(/\d+$/,'')===V.subj)));toast('Đã lưu đáp án')}catch(e){toast('Không lưu được: cần quyền chỉnh sửa trang.')}render()},
 'exp-bank':async()=>{const dl=window.claude&&await claude.use('downloads');if(!dl)return toast('Không hỗ trợ tải xuống ở chế độ này.');
  try{await dl.save({filename:'ngan-hang-cau-hoi.json',data:JSON.stringify(Object.values(Q).flat().map(q=>({...q,answer:ans(q)})),null,1)})}catch(e){}},
 reset:()=>{if(confirm('Xóa toàn bộ lịch sử và tiến độ của bạn?')){S={hist:[],stat:{},wrong:{}};save();render()}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='sq'){const w=e.target.value.toLowerCase().trim(),r=$('#sr');if(w.length<2){r.innerHTML='';return}
  const L=Object.values(Q).flat().filter(q=>qText(q).toLowerCase().includes(w)).slice(0,12);r.innerHTML=L.length?L.map(q=>`<div class="card"><span class="tag">${SN[q.subj]}</span><span class="mu">${esc(q.topic)}</span><p class="q">${esc(qText(q).slice(0,300))}</p></div>`).join(''):'<p class="mu">Không tìm thấy.</p>'}
 if(e.target.id==='kw'){V.kw=e.target.value;const p=e.target.selectionStart;render();const k=$('#kw');k.focus();k.setSelectionRange(p,p)}
 if(e.target.id&&e.target.id.startsWith('ta-')){V.tx=V.tx||{};V.tx[e.target.id.slice(3)]=e.target.value}});
render();
(async()=>{try{if(!window.claude)return;const [db,us]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!us)return;DB=db;UID=await us.id();ADMIN=await us.canEdit();
 for(const sj of ['su','sinh']){const k=await db.collection('keys').doc(sj).get();if(k.exists)Object.assign(KEYS,k.data())}
 const st=await db.collection('data/users/'+UID).doc('state').get();if(st.exists){const r=st.data();if((r.hist||[]).length>=S.hist.length)S=Object.assign(S,r);SYNC=true}
 if(V.page!=='subj'||!V.qz)render()}catch(e){}})();
</script></body></html>
