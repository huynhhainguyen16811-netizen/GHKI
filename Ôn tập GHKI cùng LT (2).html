<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập GHKI cùng LT</title>
<style>
:root{--bg:#f3f7ff;--cd:#fff;--tx:#14213d;--mu:#5b6b8c;--pr:#1d5fd1;--p2:#e4edff;--gd:#fff3c4;--ok:#0f7a58;--okb:#d9f4e8;--no:#bf3326;--nob:#fde6e3;--bd:#d6e2f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1526;--cd:#16223a;--tx:#e8eefc;--mu:#9db0d3;--pr:#6ea2ff;--p2:#1d2e51;--gd:#3a3315;--ok:#4cd6a0;--okb:#123a2d;--no:#ff8a7d;--nob:#40211e;--bd:#2a3c61}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1526;--cd:#16223a;--tx:#e8eefc;--mu:#9db0d3;--pr:#6ea2ff;--p2:#1d2e51;--gd:#3a3315;--ok:#4cd6a0;--okb:#123a2d;--no:#ff8a7d;--nob:#40211e;--bd:#2a3c61}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:880px;margin:0 auto;padding:14px 14px 70px}
.hero{background:linear-gradient(135deg,#1d5fd1,#3b8cff);color:#fff;border-radius:20px;padding:22px 18px;position:relative;overflow:hidden}
.hero h1{margin:4px 0;font-size:clamp(24px,6vw,36px);letter-spacing:.3px}.hero p{margin:4px 0 12px;background:rgba(255,243,196,.18);display:inline-block;padding:4px 12px;border-radius:99px;font-size:14px}
.hero .ic{font-size:30px;letter-spacing:6px}.bd{display:inline-block;background:var(--gd);color:#7a5a00;border-radius:99px;padding:3px 10px;font-size:13px;margin:2px 4px 0 0}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:left;cursor:pointer;color:var(--tx);font:inherit;transition:transform .15s}
.sc:hover{transform:translateY(-2px);border-color:var(--pr)}.sc b{display:block;font-size:17px}.sc .e{font-size:28px}.mu{color:var(--mu);font-size:14px}
button{font:inherit;cursor:pointer}.b1,.b2{border-radius:12px;padding:10px 14px;border:1px solid var(--pr)}.b1{background:var(--pr);color:#fff}.b2{background:var(--p2);color:var(--pr)}.w{width:100%;margin-top:8px}
.b1:disabled{opacity:.5}.fl{background:var(--gd);color:#7a5a00;border-color:#d9b640}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{white-space:nowrap;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:99px;padding:7px 13px}.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}
.bar{height:8px;background:var(--p2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1d5fd1,#f0b429)}
.op{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}
.op.sel{border-color:var(--pr);background:var(--p2)}.op.ok{border-color:var(--ok);background:var(--okb)}.op.no{border-color:var(--no);background:var(--nob)}
.pill{background:var(--gd);color:#7a5a00;border-radius:99px;padding:2px 10px;font-size:13px}.tag{background:var(--p2);color:var(--pr);border-radius:8px;padding:1px 8px;font-size:12px;margin-right:4px}
.pal{display:flex;flex-wrap:wrap;gap:6px}.pal button{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}.pal .d{background:var(--p2)}.pal .f{outline:2px solid #e0a800}.pal .c{border-color:var(--pr);font-weight:700}
.ai{white-space:pre-wrap;background:var(--p2);border-radius:12px;padding:10px 12px;margin-top:8px}.q{white-space:pre-wrap}
.ch{display:flex;gap:8px;flex-wrap:wrap}.msg{margin:8px 0;padding:10px 12px;border-radius:14px;white-space:pre-wrap}.me{background:var(--pr);color:#fff;margin-left:18%}.bot{background:var(--p2);margin-right:8%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;z-index:20}#toast.on{opacity:1}
details summary{cursor:pointer;color:var(--pr)}.warn{background:var(--gd);color:#5c4500;border-radius:12px;padding:10px 12px;font-size:14px}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const D={"tin": [{"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Thông tin khi đưa vào máy tính, chúng đều được biến đổi thành dạng chung đó là:", "num": 1, "type": "mc", "opts": ["Văn bản.", "Âm thanh.", "Hình ảnh.", "Dãy bit."], "ans": 3}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Quá trình xử lí thông tin gồm các bước nào?", "num": 2, "type": "mc", "opts": ["Tiếp nhận dữ liệu, xử lí dữ liệu, đưa ra kết quả.", "Tiếp nhận thông tin, xử lí thông tin, đưa ra kết quả.", "Tiếp nhận thông tin, chuyển thành dữ liệu, tính toán dữ liệu, đưa ra kết quả.", "Cả ba đáp án đều sai."], "ans": 0}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Thông tin là gì?", "num": 3, "type": "mc", "opts": ["Các văn bản và số liệu.", "Tất cả những gì mang lại cho chúng ta hiểu biết.", "Văn bản, hình ảnh, âm thanh.", "Hình ảnh, âm thanh."], "ans": 1}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Chọn câu đúng trong các câu sau:", "num": 4, "type": "mc", "opts": ["1MB = 1024KB.", "1PB = 1024 GB.", "1ZB = 1024PB.", "1Bit = 1024B."], "ans": 0}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Phát biểu nào sau đây là sai khi nói về quan hệ giữa thông tin và dữ liệu?", "num": 5, "type": "mc", "opts": ["Dữ liệu là thông tin đã được đưa vào máy tính.", "Thông tin là ý nghĩa của dữ liệu.", "Thông tin và dữ liệu có tính độc lập tương đối.", "Thông tin không có tính toàn vẹn."], "ans": 3}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Phát biểu nào sau đây là phù hợp nhất về khái niệm bit?", "num": 6, "type": "mc", "opts": ["Chính chữ số 1.", "Một số có 1 chữ số.", "Đơn vị đo khối lượng kiến thức.", "Đơn vị đo lượng thông tin."], "ans": 3}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Mã hoá thông tin có mục đích gì?", "num": 7, "type": "mc", "opts": ["Để thay đổi lượng thông tin.", "Để chuyển thông tin về dạng câu lệnh của ngôn ngữ máy.", "Làm cho thông tin phù hợp với dữ liệu trong máy.", "Cả A, B, C đều đúng."], "ans": 2}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Đơn vị đo lượng thông tin cơ sở là:", "num": 8, "type": "mc", "opts": ["Bit.", "GHz.", "GB.", "Byte."], "ans": 0}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Bản chất quá trình mã hóa thông tin?", "num": 9, "type": "mc", "opts": ["Chuyển dãy hệ nhị phân về hệ đếm khác.", "Đưa thông tin vào máy tính.", "Chuyển thông tin về bit nhị phân.", "Nhận dạng thông tin."], "ans": 2}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Chọn phát biểu đúng trong các câu sau:", "num": 10, "type": "mc", "opts": ["Dữ liệu là thông tin.", "RAM là bộ nhớ ngoài.", "Đĩa mềm là bộ nhớ trong.", "Một byte có 8 bits."], "ans": 3}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Trong giờ học Tin học, giáo viên yêu cầu học sinh tìm hiểu kết quả học tập của lớp. Một học sinh thu thập điểm kiểm tra của các bạn, lập bảng thống kê và nhận xét tình hình học tập để đề xuất biện pháp nâng cao kết quả học tập. Em hãy cho biết các ý sau đúng hay sai:", "num": 1, "type": "tf", "items": [{"t": "Thông tin là những gì mang lại hiểu biết cho con người.", "a": true}, {"t": "Dữ liệu và thông tin luôn đồng nghĩa với nhau.", "a": false}, {"t": "Dữ liệu có thể được biểu diễn bằng chữ, số, hình ảnh, âm thanh.", "a": true}, {"t": "Không phải thông tin nào cũng hữu ích trong mọi hoàn cảnh.", "a": true}]}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Một lớp học sử dụng máy tính để lưu trữ điểm kiểm tra, thống kê kết quả học tập và lập biểu đồ so sánh điểm số giữa các tổ. Giáo viên dựa vào kết quả thống kê để đánh giá tình hình học tập và đưa ra phương hướng hỗ trợ học sinh. Em hãy cho biết các ý sau đúng hay sai:", "num": 2, "type": "tf", "items": [{"t": "Con người vừa là chủ thể tiếp nhận, vừa là chủ thể xử lí thông tin.", "a": true}, {"t": "Máy tính có thể thay thế hoàn toàn con người trong việc xử lí thông tin.", "a": false}, {"t": "Thông tin được lưu trữ trong máy tính dưới dạng dữ liệu.", "a": true}, {"t": "Việc xử lí thông tin giúp biến dữ liệu thành kết quả có ý nghĩa.", "a": true}]}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Một học sinh sử dụng máy tính để nhập điểm kiểm tra của các bạn trong lớp, tính điểm trung bình, sắp xếp kết quả theo thứ tự giảm dần và tạo biểu đồ thống kê. Máy tính lưu trữ dữ liệu và thực hiện các phép tính theo yêu cầu của học sinh. Em hãy cho biết các ý sau đúng hay sai:", "num": 3, "type": "tf", "items": [{"t": "Xử lí thông tin là quá trình nhập dữ liệu và lưu giữ dữ liệu mà không cần biến đổi.", "a": false}, {"t": "Biểu diễn thông tin trên máy tính phải dưới dạng các con số nhị phân.", "a": true}, {"t": "Thông tin sau khi xử lí có thể giúp đưa ra quyết định.", "a": true}, {"t": "Không thể biến đổi dữ liệu đầu vào thành nhiều thông tin khác nhau.", "a": false}]}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Hãy phân biệt khái niệm dữ liệu và thông tin bằng ví dụ minh hoạ.", "num": 1, "type": "es", "guide": ["Dữ liệu (Data): Là các con số, chữ viết, hình ảnh, âm thanh hoặc kí hiệu chưa qua xử lí, được lưu trữ trong máy tính nhằm đại diện cho một thực tế nào đó. Dữ liệu chưa mang lại ý nghĩa rõ ràng nếu đứng độc lập.", "Thông tin (Information): Là ý nghĩa của dữ liệu sau khi đã được con người hoặc máy tính xử lí, sắp xếp, phân tích nhằm đem lại sự hiểu biết và giúp đưa ra quyết định.", "Ví dụ minh hoạ: Dãy số \"39, 40, 38\" đứng riêng lẻ chỉ là dữ liệu số. Khi đặt vào ngữ cảnh bảng theo dõi y tế của một bệnh nhân và được ghi chú là \"Nhiệt độ cơ thể của bệnh nhân A qua các giờ\", ta thu được thông tin: Bệnh nhân A đang bị sốt cao."]}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Vì sao nói xử lí thông tin là quá trình biến đổi dữ liệu thành thông tin có ý nghĩa?", "num": 2, "type": "es", "guide": ["Bản thân dữ liệu thô thường rời rạc, chưa có tính liên kết và chưa thể hiện được bản chất của sự vật, hiện tượng.", "Quá trình xử lí thông tin (bao gồm thu thập, phân tích, tính toán, so sánh, tổng hợp) sẽ làm lộ ra mối quan hệ giữa các dữ liệu, chuyển hóa chúng thành những kiến thức hữu ích, giúp con người hiểu được bản chất vấn đề và đưa ra hành động hay quyết định chính xác. Do đó, xử lí thông tin chính là cầu nối biến dữ liệu thô thành thông tin có giá trị sử dụng."]}, {"topic": "Bài 1: Thông tin và xử lí thông tin", "q": "Hãy lấy một ví dụ trong học tập cho thấy vai trò của xử lí thông tin.", "num": 3, "type": "es", "guide": ["Ví dụ: Việc tính điểm trung bình môn học cuối học kì.", "Dữ liệu đầu vào: Điểm số của các bài kiểm tra thường xuyên, kiểm tra giữa kì và kiểm tra cuối kì (ví dụ: 8, 7, 9, 8.5).", "Quá trình xử lí: Áp dụng công thức tính điểm trung bình môn có tính đến hệ số của từng loại bài kiểm tra.", "Thông tin đầu ra: Điểm trung bình môn học (ví dụ: 8.2 - Học lực Giỏi). Thông tin này giúp học sinh biết được năng lực học tập của mình đối với môn học đó, từ đó điều chỉnh phương pháp học tập phù hợp hơn trong học kì tiếp theo."]}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Chọn nhóm từ thích hợp điền vào đoạn sau: Ngành tin học gắn liền với…… và ……máy tính điện tử.", "num": 1, "type": "mc", "opts": ["Tiêu thụ, sự phát triển.", "Sự phát triển, tiêu thụ.", "Sử dụng, tiêu thụ.", "Sự phát triển, sử dụng."], "ans": 3}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Loại công cụ nào gắn liền với nền văn minh thông tin?", "num": 2, "type": "mc", "opts": ["Máy phát điện.", "Máy tính điện tử.", "Đồng hồ.", "Động cơ hơi nước."], "ans": 1}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Trong những tình huống nào sau đây, máy tính thực thi công việc tốt hơn con người?", "num": 3, "type": "mc", "opts": ["Khi dịch một tài liệu.", "Khi thực hiện một phép toán phức tạp.", "Khi chuẩn đoán bệnh.", "Khi phân tích tâm lí một con người."], "ans": 1}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Phát biểu nào dưới đây về khả năng của máy tính là phù hợp nhất?", "num": 4, "type": "mc", "opts": ["Lập trình và soạn thảo văn bản.", "Công cụ xử lí thông tin.", "Giải trí.", "Tất cả phương án trên."], "ans": 1}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Đặc thù của ngành tin học là gì?", "num": 5, "type": "mc", "opts": ["Quá trình nghiên cứu và ứng dụng các công cụ tính toán.", "Quá trình nghiên cứu và xử lí thông tin một cách tự động.", "Quá trình nghiên cứu và triển khai các ứng dụng không tách rời việc phát triển và sử dụng máy tính điện tử.", "Quá trình nghiên cứu và xử lí thông tin."], "ans": 2}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Chọn phương án ghép đúng nói về thuật ngữ tin học trong các câu sau: Tin học là…", "num": 6, "type": "mc", "opts": ["Lập chương trình cho máy tính.", "Máy tính và các công việc liên quan đến máy tính điện tử.", "Áp dụng máy tính trong các hoạt động xử lý thông tin.", "Ngành khoa học về xử lý thông tin tự động dựa trên máy tính điện tử."], "ans": 3}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Phát biểu nào dưới đây là sai?", "num": 7, "type": "mc", "opts": ["Máy tính tốt là máy tính nhỏ, gọn và đẹp.", "Máy tính ra đời làm thay đổi phương thức quản lí và giao tiếp trong xã hội.", "Các chương trình trên máy tính ngày càng đáp ứng được nhiều ứng dụng thực tế và dễ sử dụng hơn.", "Giá thành máy tính ngày càng hạ nhưng tốc độ, độ chính xác của máy tính ngày càng cao."], "ans": 0}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Máy tính trở thành công cụ lao động không thể thiếu được trong xã hội hiện đại vì:", "num": 8, "type": "mc", "opts": ["Máy tính tính toán cực kì nhanh và chính xác.", "Máy tính là công cụ soạn thảo văn bản và cho ta truy cập vào Internet để tìm kiếm thông tin.", "Máy tính giúp cho con người giải tất cả các bài toán khó.", "Máy tính cho ta khả năng lưu trữ và xử lý thông tin."], "ans": 3}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Tin học là một ngành khoa học vì đó là ngành:", "num": 9, "type": "mc", "opts": ["Có nội dung, mục tiêu, phương pháp nghiên cứu riêng.", "Được sinh ra trong nền văn minh thông tin.", "Sử dụng máy tính điện tử.", "Nghiên cứu máy tính điện tử."], "ans": 0}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Đặc điểm nổi bật của xã hội hiện nay là gì?", "num": 10, "type": "mc", "opts": ["Sự ra đời của máy cơ khí.", "Sự ra đời của máy tính điện tử.", "Sự ra đời của máy bay.", "Cả A, B, C."], "ans": 1}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Thiết bị thông minh và tin học có vai trò quan trọng trong đời sống xã hội. Em hãy cho biết các ý sau đúng hay sai:", "num": 1, "type": "tf", "items": [{"t": "Thiết bị thông minh hỗ trợ con người học tập, giải trí và làm việc hiệu quả hơn.", "a": true}, {"t": "Tin học chỉ được ứng dụng trong lĩnh vực khoa học tự nhiên, không liên quan đến y tế hay giáo dục.", "a": false}, {"t": "Các thiết bị thông minh có thể kết nối Internet để trao đổi và chia sẻ dữ liệu.", "a": true}, {"t": "Sử dụng thiết bị thông minh cần có ý thức để tránh lệ thuộc hoặc ảnh hưởng xấu đến sức khỏe.", "a": true}]}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Hãy xác định đúng hay sai trong các nhận định sau về vai trò của tin học:", "num": 2, "type": "tf", "items": [{"t": "Tin học góp phần thúc đẩy sự phát triển kinh tế - xã hội.", "a": true}, {"t": "Ứng dụng tin học giúp tăng năng suất lao động và giảm sai sót trong công việc.", "a": true}, {"t": "Tin học chỉ mang lại lợi ích cho các nhà nghiên cứu, không liên quan đến đời sống hằng ngày.", "a": false}, {"t": "Tin học giúp tăng cường khả năng giao tiếp và kết nối toàn cầu.", "a": true}]}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Đối với xã hội hiện đại, thiết bị thông minh có ảnh hưởng như thế nào? (Đúng/Sai)", "num": 3, "type": "tf", "items": [{"t": "Góp phần xây dựng thành phố thông minh, giao thông thông minh.", "a": true}, {"t": "Giúp tiết kiệm năng lượng, quản lý tài nguyên hiệu quả.", "a": true}, {"t": "Hoàn toàn thay thế được lao động trí óc của con người.", "a": false}, {"t": "Tạo ra nhiều tiện ích mới nhưng cũng cần chú ý đến vấn đề bảo mật và an toàn thông tin.", "a": true}]}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Trình bày vai trò của thiết bị thông minh trong đời sống hằng ngày.", "num": 1, "type": "es", "guide": ["Trong sinh hoạt và giải trí: Các thiết bị thông minh (điện thoại thông minh, tivi thông minh, robot hút bụi...) giúp tự động hóa nhiều công việc gia đình, kết nối liên lạc nhanh chóng và cung cấp kho tàng giải trí phong phú.", "Trong học tập và công việc: Hỗ trợ tìm kiếm tài liệu, tham gia các khóa học trực tuyến, lưu trữ dữ liệu cá nhân, quản lí thời gian làm việc hiệu quả mọi lúc mọi nơi nhờ kết nối Internet liên tục."]}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Vì sao nói tin học là một trong những động lực thúc đẩy phát triển kinh tế - xã hội?", "num": 2, "type": "es", "guide": ["Tối ưu hoá sản xuất và quản lí: Tin học giúp tự động hóa các dây chuyền sản xuất, số hóa quy trình quản lí doanh nghiệp, làm tăng năng suất lao động và giảm thiểu chi phí vận hành.", "Thúc đẩy kinh tế số: Sự phát triển của các ngành thương mại điện tử, dịch vụ ngân hàng số, giao dịch trực tuyến đã thay đổi cách thức vận hành của nền kinh tế toàn cầu, tạo ra nhiều ngành nghề mới.", "Nâng cao dân trí và chất lượng dịch vụ: Ứng dụng tin học trong y tế (bệnh án điện tử, hội chẩn từ xa) và giáo dục (học trực tuyến, bài giảng số) góp phần nâng cao chất lượng cuộc sống người dân."]}, {"topic": "Bài 2: Vai trò của thiết bị thông minh và tin học đối với xã hội", "q": "Em hãy phân tích một ví dụ minh họa việc ứng dụng tin học trong quản lý nhà nước hoặc doanh nghiệp.", "num": 3, "type": "es", "guide": ["Ví dụ về quản lý nhà nước: Cổng dịch vụ công quốc gia trực tuyến.", "Phân tích: Trước đây, người dân muốn làm các thủ tục hành chính (như cấp hộ chiếu, đăng ký khai sinh, làm giấy tờ đất đai) phải đến trực tiếp cơ quan nhà nước, xếp hàng và chuẩn bị nhiều hồ sơ giấy. Hiện nay, nhờ ứng dụng tin học và cơ sở dữ liệu quốc gia, người dân có thể nộp hồ sơ qua mạng ở bất cứ đâu. Hệ thống tự động tiếp nhận, phân loại và cập nhật tiến độ xử lý. Việc này giúp tiết kiệm thời gian, công sức của người dân, đồng thời giúp cơ quan quản lý nhà nước giám sát công việc minh bạch, chính xác và giảm thiểu tiêu cực."]}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Bộ định tuyến (Router) có thể có mấy cổng mạng?", "num": 1, "type": "mc", "opts": ["4.", "5.", "7.", "Vô số."], "ans": 0}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Phạm vi sử dụng của internet là?", "num": 2, "type": "mc", "opts": ["Chỉ trong gia đình.", "Chỉ trong cơ quan.", "Chỉ ở trên máy tính và điện thoại.", "Toàn cầu."], "ans": 3}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Điện thoại thông minh được kết nối internet bằng cách nào?", "num": 3, "type": "mc", "opts": ["Qua dịch vụ 3G, 4G, 5G.", "Kết nối gián tiếp qua wifi.", "Cả A và B.", "Không thể kết nối."], "ans": 2}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Theo phạm vi địa lí, mạng máy tính chia thành mấy loại?", "num": 4, "type": "mc", "opts": ["3.", "4.", "2.", "5."], "ans": 2}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Mạng cục bộ viết tắt là gì?", "num": 5, "type": "mc", "opts": ["LAN.", "WAN.", "MCB.", "Không có kí tự viết tắt."], "ans": 0}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Mạng LAN có phạm vi địa lí…. mạng WAN.", "num": 6, "type": "mc", "opts": ["Lớn hơn.", "Bé hơn.", "Bằng.", "Bằng hoặc lớn hơn."], "ans": 1}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Các LAN có thể kết nối với nhau thông qua thiết bị nào?", "num": 7, "type": "mc", "opts": ["Switch.", "HUB.", "Router.", "Không có."], "ans": 2}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Chọn phát biểu đúng?", "num": 8, "type": "mc", "opts": ["Mạng cục bộ không có chủ sở hữu.", "Mạng internet có chủ sở hữu.", "Phạm vi của mạng internet là toàn cầu.", "Mạng cục bộ không thể lắp đặt trong gia đình."], "ans": 2}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Internet có lợi ích đối với các hoạt động nào sau đây?", "num": 9, "type": "mc", "opts": ["Giải trí.", "Bảo vệ sức khỏe.", "Học tập, làm việc, giao tiếp.", "Cả 3 ý trên."], "ans": 3}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Phần mềm có thể chia thành mấy nhóm?", "num": 10, "type": "mc", "opts": ["3.", "2.", "4.", "5."], "ans": 1}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Cho biết các phát biểu sau là Đúng hay Sai:", "num": 1, "type": "tf", "items": [{"t": "Mạng máy tính là tập hợp nhiều máy tính được kết nối với nhau để chia sẻ dữ liệu và tài nguyên.", "a": true}, {"t": "Máy tính trong mạng chỉ có thể trao đổi dữ liệu khi được nối Internet.", "a": false}, {"t": "Mạng máy tính có thể là mạng có dây hoặc không dây.", "a": true}, {"t": "Khi kết nối mạng, các thiết bị có thể chia sẻ máy in và các tệp dữ liệu.", "a": true}]}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Cho biết các phát biểu sau là Đúng hay Sai:", "num": 2, "type": "tf", "items": [{"t": "Mạng LAN thường được sử dụng trong phạm vi hẹp như gia đình, trường học, công ty.", "a": true}, {"t": "Mạng WAN có phạm vi rộng, kết nối nhiều mạng LAN ở các khu vực khác nhau.", "a": true}, {"t": "Internet là một mạng LAN quy mô toàn cầu.", "a": false}, {"t": "Mạng Internet giúp người dùng truy cập và khai thác thông tin toàn cầu.", "a": true}]}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Cho biết các phát biểu sau là Đúng hay Sai:", "num": 3, "type": "tf", "items": [{"t": "Mạng máy tính giúp việc trao đổi thông tin nhanh chóng và thuận tiện hơn.", "a": true}, {"t": "Nhờ mạng máy tính, nhiều người có thể cùng làm việc trên một tệp dữ liệu chung.", "a": true}, {"t": "Mạng máy tính chỉ có ích trong học tập chứ không có ứng dụng trong y tế hay kinh tế.", "a": false}, {"t": "Mạng máy tính góp phần quan trọng trong quá trình chuyển đổi số của xã hội.", "a": true}]}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Trình bày khái niệm mạng máy tính. Nêu các lợi ích cơ bản của việc sử dụng mạng máy tính trong đời sống.", "num": 1, "type": "es", "guide": ["Khái niệm: Mạng máy tính là một tập hợp các máy tính và thiết bị được kết nối với nhau theo một phương thức nào đó truyền thông tin qua lại nhằm chia sẻ dữ liệu và dùng chung thiết bị ngoại vi.", "Lợi ích cơ bản: Giúp liên lạc, gửi nhận thông tin nhanh chóng qua email, mạng xã hội; cho phép chia sẻ các tệp dữ liệu lớn mà không tốn công sao chép vật lý; dùng chung các thiết bị phần cứng đắt tiền như máy in, máy quét, bộ lưu trữ tập trung nhằm tiết kiệm chi phí; lưu trữ và sao lưu dữ liệu an toàn hơn."]}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Phân biệt mạng LAN và mạng WAN về phạm vi sử dụng và ứng dụng thực tế.", "num": 2, "type": "es", "guide": ["Mạng LAN (Local Area Network - Mạng cục bộ):", "Phạm vi sử dụng: Hẹp, giới hạn trong một khu vực nhỏ như một căn phòng, một ngôi nhà, một trường học hoặc một tòa nhà văn phòng.", "Ứng dụng thực tế: Dùng để kết nối các máy tính của nhân viên trong công ty để chia sẻ dữ liệu nội bộ, kết nối máy tính với máy in chung trong văn phòng, thiết lập mạng wifi nội bộ gia đình.", "Mạng WAN (Wide Area Network - Mạng diện rộng):", "Phạm vi sử dụng: Rộng lớn, có thể bao phủ một tỉnh, một quốc gia, một châu lục hoặc trên toàn cầu (kết nối nhiều mạng LAN lại với nhau).", "Ứng dụng thực tế: Sử dụng trong hệ thống mạng của ngân hàng để liên kết tất cả các chi nhánh trên toàn quốc, hệ thống quản lý của các tập đoàn đa quốc gia, và mạng Internet chính là mạng WAN lớn nhất."]}, {"topic": "Bài 8: Mạng máy tính trong cuộc sống hiện đại", "q": "Theo em, Internet đã thay đổi cách con người học tập và làm việc như thế nào? Hãy nêu ví dụ minh họa.", "num": 3, "type": "es", "guide": ["Thay đổi trong học tập: Giúp xóa bỏ rào cản địa lý và thời gian. Người học có thể tiếp cận kho tàng tri thức khổng lồ của nhân loại, học mọi lúc mọi nơi thông qua các bài giảng trực tuyến, các diễn đàn học tập toàn cầu.", "Ví dụ: Học sinh tham gia lớp học trực tuyến qua Zoom/Google Meet và tự tra cứu tài liệu học tập trên các trang web giáo dục chính thống mà không cần đến thư viện truyền thống.", "Thay đổi trong làm việc: Tạo ra các mô hình làm việc từ xa (remote work), làm việc nhóm trực tuyến thời gian thực mà không cần ngồi cùng một văn phòng, giúp tăng tốc độ xử lý công việc.", "Ví dụ: Các nhân viên trong dự án cùng chỉnh sửa một tài liệu báo cáo trên Google Docs tại cùng một thời điểm dù họ ở các thành phố khác nhau."]}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Khi truy cập mạng, mọi người có thể bị kẻ xấu lợi dụng, ăn cắp thông tin hay không?", "num": 1, "type": "mc", "opts": ["Có.", "Không.", "Tùy trường hợp.", "Không thể."], "ans": 0}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Biện pháp nào bảo vệ thông tin cá nhân không đúng khi truy cập mạng?", "num": 2, "type": "mc", "opts": ["Không ghi chép thông tin cá nhân ở nơi người khác có thể đọc.", "Giữ máy tính không nhiễm phần mềm gián điệp.", "Cẩn trọng khi truy cập mạng qua wifi công cộng.", "Đăng tải tất cả thông tin cá nhân lên mạng cho mọi người cùng biết."], "ans": 3}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Biện pháp nào phòng chống hành vi bắt nạt trên mạng?", "num": 3, "type": "mc", "opts": ["Không kết bạn dễ dãi trên mạng.", "Không trả lời thư từ với kẻ bắt nạt trên diễn đàn.", "Chia sẻ với bố mẹ, thầy cô.", "Cả 3 ý trên."], "ans": 3}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Theo cơ chế lây nhiễm, có mấy loại phần mềm độc hại?", "num": 4, "type": "mc", "opts": ["3.", "2.", "4.", "5."], "ans": 0}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Thảm họa Sâu WannaCry tống tiền bằng cách mã hóa toàn bộ thông tin có trên đĩa cứng và đòi tiền chuộc mới cho phần mềm hóa giải diễn ra vào năm nào?", "num": 5, "type": "mc", "opts": ["2016.", "2017.", "2018.", "2019."], "ans": 1}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Tác động của virus đối với người dùng và máy tính?", "num": 6, "type": "mc", "opts": ["Gây khó chịu với người dùng.", "Làm hỏng phần mềm khác trong máy.", "Xóa dữ liệu, làm tê liệt máy tính.", "Cả A, B, C."], "ans": 3}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Bản chất của virus là gì?", "num": 7, "type": "mc", "opts": ["Các phần mềm hoàn chỉnh.", "Các đoạn mã độc.", "Các đoạn mã độc gắn với một phần mềm.", "Là sinh vật có thể thấy được."], "ans": 2}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Bản chất của Worm, sâu máy tính là gì ?", "num": 8, "type": "mc", "opts": ["Phần mềm hoàn chỉnh.", "Một đoạn mã độc.", "Nhiều đoạn mã độc.", "Cả 3 ý trên."], "ans": 0}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Trojan gọi là gì?", "num": 9, "type": "mc", "opts": ["Phần mềm độc.", "Mã độc.", "Ứng dụng độc.", "Phần mềm nội gián."], "ans": 3}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Phần mềm độc hại viết ra có tác dụng gì?", "num": 10, "type": "mc", "opts": ["Dùng để hỗ trợ các ứng dụng.", "Dùng với ý đồ xấu, gây ra tác động không mong muốn.", "Cải thiện khả năng xử lí của máy tính.", "Cả 3 ý trên."], "ans": 1}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Cho biết các phát biểu sau là Đúng hay Sai:", "num": 1, "type": "tf", "items": [{"t": "An toàn trên không gian mạng là việc bảo vệ thông tin cá nhân và thiết bị khi tham gia môi trường số.", "a": true}, {"t": "Mọi thông tin đăng tải lên mạng đều hoàn toàn an toàn và không thể bị lợi dụng.", "a": false}, {"t": "Sử dụng mật khẩu mạnh giúp tăng cường an toàn khi tham gia mạng.", "a": true}, {"t": "Cần cẩn trọng khi chia sẻ thông tin cá nhân trên Internet.", "a": true}]}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Cho biết các phát biểu sau là Đúng hay Sai:", "num": 2, "type": "tf", "items": [{"t": "Virus, phần mềm độc hại có thể lây lan qua email, tệp tải về hoặc các liên kết lạ.", "a": true}, {"t": "Cập nhật phần mềm thường xuyên giúp hạn chế rủi ro bảo mật.", "a": true}, {"t": "Không nên cài đặt phần mềm diệt virus trên máy tính cá nhân.", "a": false}, {"t": "Chỉ nên tải ứng dụng từ những nguồn đáng tin cậy.", "a": true}]}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Cho biết các phát biểu sau là Đúng hay Sai:", "num": 3, "type": "tf", "items": [{"t": "Mạng xã hội có thể bị kẻ xấu lợi dụng để lừa đảo và chiếm đoạt thông tin.", "a": true}, {"t": "Cần kiểm chứng độ tin cậy của thông tin trước khi chia sẻ trên mạng.", "a": true}, {"t": "Tin giả, tin sai sự thật không gây hại trong xã hội.", "a": false}, {"t": "Cần có trách nhiệm khi đăng tải, bình luận và tương tác trên không gian mạng.", "a": true}]}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Vì sao cần phải giữ bí mật thông tin cá nhân khi tham gia các hoạt động trên Internet? Hãy nêu ví dụ minh họa.", "num": 1, "type": "es", "guide": ["Lý do: Giữ bí mật thông tin cá nhân (như họ tên, ngày sinh, số điện thoại, địa chỉ nhà, mật khẩu tài khoản) nhằm bảo vệ bản thân khỏi nguy cơ bị kẻ xấu lợi dụng để lừa đảo chiếm đoạt tài sản, bôi nhọ danh dự, định danh giả mạo, hoặc bắt nạt trực tuyến.", "Ví dụ minh hoạ: Nếu bạn đăng ảnh thẻ học sinh có đầy đủ thông tin trường lớp, ngày sinh lên Facebook công khai, kẻ xấu có thể lưu lại thông tin này để gọi điện lừa đảo cha mẹ bạn rằng bạn đang gặp tai nạn ở trường và yêu cầu chuyển tiền gấp."]}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Trình bày một số biện pháp giúp bảo vệ tài khoản trực tuyến (email, mạng xã hội, ngân hàng điện tử...).", "num": 2, "type": "es", "guide": ["Đặt mật khẩu mạnh: Có độ dài từ 8 kí tự trở lên, bao gồm cả chữ hoa, chữ thường, số và kí tự đặc biệt; tuyệt đối không dùng ngày sinh hay số điện thoại làm mật khẩu.", "Kích hoạt xác thực hai yếu tố (2FA): Yêu cầu mã xác nhận gửi về số điện thoại hoặc ứng dụng xác thực khi đăng nhập từ thiết bị lạ.", "Không bấm vào liên kết lạ hoặc tệp đính kèm không rõ nguồn gốc được gửi qua email/tin nhắn mạng xã hội.", "Tránh đăng nhập tài khoản cá nhân trên các máy tính công cộng hoặc sử dụng các mạng wifi công cộng không có mật khẩu bảo vệ."]}, {"topic": "Bài 9: An toàn trong không gian mạng", "q": "Em hãy phân tích tác hại của tin giả (fake news) trên không gian mạng đối với cá nhân và xã hội.", "num": 3, "type": "es", "guide": ["Đối với cá nhân: Tin giả có thể gây hoang mang, sợ hãi vô căn cứ, làm sai lệch nhận thức dẫn đến các quyết định sai lầm (ví dụ: tin giả về phương pháp chữa bệnh sai khoa học). Nó cũng có thể làm hủy hoại danh dự, nhân phẩm của cá nhân bị bôi nhọ.", "Đối với xã hội: Làm suy giảm niềm tin của công chúng vào hệ thống pháp luật và các cơ quan chính thống; gây bất ổn an ninh trật tự, kích động xung đột bè phái hoặc gây thiệt hại nghiêm trọng về kinh tế nếu đó là tin giả về thị trường tài chính, dịch bệnh."]}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Đạo đức là gì?", "num": 1, "type": "mc", "opts": ["Hệ thống các quy tắc, chuẩn mực xã hội mà con người phải tự giác thực hiện phù hợp với lợi ích cộng đồng, xã hội.", "Hệ thống các quy tắc, chuẩn mực xã hội mà con người không bắt buộc phải thực hiện phù hợp với lợi ích cộng đồng, xã hội.", "Hệ thống các quy tắc, chuẩn mực xã hội.", "Cả 3 ý trên."], "ans": 0}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Hành vi nào xấu khi giao tiếp trên mạng?", "num": 2, "type": "mc", "opts": ["Đưa thông tin sai lệch lên mạng.", "Gửi thư rác, tin rác.", "Vi phạm bản quyền khi sử dụng dữ liệu.", "Cả 3 ý trên."], "ans": 3}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Đưa thông tin không phù hợp lên mạng có thể bị coi là vi phạm gì?", "num": 3, "type": "mc", "opts": ["Vi phạm pháp luật.", "Vi phạm đạo đức.", "Tùy theo nội dung và hậu quả.", "Không vi phạm."], "ans": 2}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Công bố thông tin cá nhân hay tổ chức mà không được phép là loại hành vi vi phạm gì?", "num": 4, "type": "mc", "opts": ["Vi phạm đạo đức.", "Vi phạm pháp luật.", "Cả A và B.", "Không vi phạm."], "ans": 2}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Vấn đề tiêu cực có thể nảy sinh khi tham gia hoạt động nào trên mạng?", "num": 5, "type": "mc", "opts": ["Tranh luận trên facebook.", "Gửi thư điện tử.", "Đăng bài viết, ảnh không đúng về cá nhân khác.", "Cả 3 ý trên."], "ans": 3}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Luật An ninh mạng được Quốc hội Việt Nam ban hành vào năm nào?", "num": 6, "type": "mc", "opts": ["8.", "2008.", "2018.", "2017."], "ans": 2}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Hành vi nào sau đây không là hành vi vi phạm pháp luật về chia sẻ thông tin?", "num": 7, "type": "mc", "opts": ["Chia sẻ tin tức của trang báo Lao Động lên trang cá nhân Facebook.", "Chia sẻ văn hoá phẩm đồi truỵ trên mạng.", "Đăng tin sai sự thật về người khác lên Zalo.", "Phát tán video độc hại lên mạng."], "ans": 0}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Quyền tác giả là gì?", "num": 8, "type": "mc", "opts": ["Quyền của tổ chức, cá nhân đối với tác phẩm mình sáng tạo ra hoặc sở hữu.", "Quyền của tổ chức, cá nhân đối với tác phẩm mình không sáng tạo ra hoặc không sở hữu.", "Quyền của tất cả mọi người đối với tác phẩm mình sáng tạo ra hoặc sở hữu.", "Không có quyền tác giả."], "ans": 0}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Ngày 25 tháng 6 năm 2019, Quốc hội Việt Nam ban hành Luật gì quy định quyền tác giả đối với tác phẩm?", "num": 9, "type": "mc", "opts": ["Luật tác giả.", "Luật sở hữu.", "Luật sở hữu trí tuệ.", "Luật trí tuệ."], "ans": 2}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Luật Sở hữu trí tuệ bao gồm quyền thân nhân và quyền:", "num": 10, "type": "mc", "opts": ["Sở hữu.", "Trí tuệ.", "Tài sản.", "Giá trị."], "ans": 2}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Hãy cho biết các phát biểu sau về ứng xử văn minh trên môi trường số là Đúng hay Sai:", "num": 1, "type": "tf", "items": [{"t": "Cần sử dụng lời nói, bình luận lịch sự, tôn trọng người khác khi giao tiếp trực tuyến.", "a": true}, {"t": "Có thể đăng tải bất kỳ thông tin nào lên mạng xã hội mà không cần suy nghĩ.", "a": false}, {"t": "Kiểm chứng thông tin trước khi chia sẻ giúp hạn chế lan truyền tin giả.", "a": true}, {"t": "Ứng xử thiếu văn minh trên mạng có thể gây ra hậu quả nghiêm trọng ngoài đời thực.", "a": true}]}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Hãy cho biết các phát biểu sau về tôn trọng bản quyền trên môi trường số là Đúng hay Sai:", "num": 2, "type": "tf", "items": [{"t": "Khi sử dụng hình ảnh, bài viết của người khác cần ghi rõ nguồn hoặc xin phép tác giả.", "a": true}, {"t": "Tải phần mềm lậu là hành vi vi phạm bản quyền.", "a": true}, {"t": "Có thể tự do sao chép và chia sẻ tác phẩm của người khác nếu không nhằm mục đích thương mại.", "a": false}, {"t": "Tôn trọng bản quyền góp phần xây dựng môi trường số lành mạnh và công bằng.", "a": true}]}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Hãy cho biết các phát biểu sau về trách nhiệm của cá nhân khi tham gia môi trường số là Đúng hay Sai:", "num": 3, "type": "tf", "items": [{"t": "Mỗi cá nhân cần ý thức bảo vệ thông tin cá nhân và tôn trọng thông tin của người khác.", "a": true}, {"t": "Được phép mạo danh người khác để tạo tài khoản mạng xã hội nếu chỉ để giải trí.", "a": false}, {"t": "Hành vi quấy rối, xúc phạm người khác trên mạng có thể bị xử lý theo pháp luật.", "a": true}, {"t": "Tham gia tích cực, văn minh giúp tạo dựng cộng đồng mạng an toàn và thân thiện.", "a": true}]}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Em hãy nêu ý nghĩa của việc ứng xử văn minh trên môi trường số đối với bản thân và cộng đồng.", "num": 1, "type": "es", "guide": ["Đối với bản thân: Giúp xây dựng một hình ảnh cá nhân uy tín, tích cực và đáng tin cậy trên không gian mạng; bảo vệ bản thân khỏi những tranh chấp, xung đột không đáng có ngoài đời thực.", "Đối với cộng đồng: Giúp giảm thiểu tình trạng bạo lực ngôn từ, thông tin độc hại, góp phần tạo nên một môi trường mạng xã hội văn minh, an toàn, thân thiện và tràn đầy năng lượng tích cực cho mọi người."]}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Theo em, việc tôn trọng bản quyền trong môi trường số có vai trò như thế nào trong học tập và đời sống?", "num": 2, "type": "es", "guide": ["Tôn trọng chất xám và công sức sáng tạo: Thể hiện sự tôn trọng đối với tác giả, người đã dành thời gian và trí tuệ để tạo ra sản phẩm.", "Khuyến khích sự sáng tạo phát triển: Khi bản quyền được tôn trọng và bảo vệ, các tác giả sẽ có động lực kinh tế và tinh thần để tiếp tục sáng tạo và cống hiến thêm nhiều sản phẩm giá trị.", "Đảm bảo tuân thủ pháp luật: Giúp bản thân người sử dụng tránh khỏi các rủi ro pháp lý liên quan đến vi phạm quyền sở hữu trí tuệ trong học tập và công việc kinh doanh thực tế."]}, {"topic": "Bài 11: Ứng dụng trên môi trường số. Nghĩa vụ tôn trọng bản quyền", "q": "Hãy trình bày một số nguyên tắc cần tuân thủ khi tham gia bình luận, thảo luận trên mạng xã hội để thể hiện thái độ ứng xử đúng mực.", "num": 3, "type": "es", "guide": ["Sử d
